<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>贪吃蛇 · Snake</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --bg-grid: #1a1a2e;
      --snake: #00e676;
      --snake-dark: #00c853;
      --food: #ff5252;
      --accent: #7c4dff;
      --text: #e0e0e0;
      --text-muted: #6b7280;
      --radius: 0.75rem;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 全屏布局 */
    .game-wrapper {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
    }

    /* 顶部信息栏 */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 500px;
      padding: 0 0.25rem;
    }
    .score-box {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }
    .score-box.right { align-items: flex-end; }
    .score-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.15rem;
    }
    .score-value {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--snake);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .score-box.right .score-value { color: var(--accent); }
    .title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--text);
    }
    .title span { color: var(--snake); }

    /* 画布容器 */
    .canvas-wrap {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow), 0 0 0 2px rgba(124, 77, 255, 0.15);
      background: var(--bg-grid);
    }
    canvas { display: block; }

    /* 覆盖层 */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      background: rgba(15, 15, 26, 0.88);
      backdrop-filter: blur(6px);
      transition: opacity 0.3s, visibility 0.3s;
      z-index: 10;
      text-align: center;
      padding: 1.5rem;
    }
    .overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .overlay h2 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 800;
      background: linear-gradient(135deg, var(--snake), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .overlay p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      max-width: 340px;
    }
    .overlay .final-score {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--food);
    }
    .btn {
      padding: 0.7rem 2.2rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.2s;
      background: linear-gradient(135deg, var(--snake), var(--snake-dark));
      color: #0a0a0a;
      box-shadow: 0 4px 16px rgba(0, 230, 118, 0.3);
    }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0, 230, 118, 0.45); }
    .btn:active { transform: translateY(0); }

    /* 操作提示 */
    .hint {
      display: flex;
      gap: 1.5rem;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .hint kbd {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      background: rgba(124, 77, 255, 0.15);
      border: 1px solid rgba(124, 77, 255, 0.3);
      border-radius: 0.3rem;
      font-family: monospace;
      font-size: 0.75rem;
      color: var(--accent);
      margin: 0 0.15rem;
    }

    /* 移动端方向键 */
    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 56px);
      grid-template-rows: repeat(3, 56px);
      gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .touch-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(124, 77, 255, 0.12);
      border: 1px solid rgba(124, 77, 255, 0.25);
      border-radius: 0.6rem;
      color: var(--accent);
      font-size: 1.4rem;
      cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-btn:active { background: rgba(124, 77, 255, 0.3); }
    .touch-btn[data-dir="up"]    { grid-column: 2; grid-row: 1; }
    .touch-btn[data-dir="left"]  { grid-column: 1; grid-row: 2; }
    .touch-btn[data-dir="right"] { grid-column: 3; grid-row: 2; }
    .touch-btn[data-dir="down"]  { grid-column: 2; grid-row: 3; }

    @media (hover: none) and (pointer: coarse) {
      .touch-controls { display: grid; }
      .hint { display: none; }
    }

    /* 暂停遮罩 */
    .pause-tag {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2rem;
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 2px 12px rgba(0,0,0,0.6);
      z-index: 5;
      display: none;
    }
    .pause-tag.show { display: block; }
  </style>
</head>
<body>
  <div class="game-wrapper">
    <!-- 顶部信息栏 -->
    <div class="topbar">
      <div class="score-box">
        <span class="score-label">得分</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="title">贪<span>吃</span>蛇</div>
      <div class="score-box right">
        <span class="score-label">最高分</span>
        <span class="score-value" id="highScore">0</span>
      </div>
    </div>

    <!-- 游戏画布 -->
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="game"></canvas>
      <div class="pause-tag" id="pauseTag">⏸ 暂停</div>

      <!-- 开始遮罩 -->
      <div class="overlay" id="startOverlay">
        <h2>🐍 贪吃蛇</h2>
        <p>使用方向键或 WASD 控制蛇的方向，吃掉红色食物得分，不要撞到墙壁或自己！</p>
        <button class="btn" id="startBtn">开始游戏</button>
      </div>

      <!-- 游戏结束遮罩 -->
      <div class="overlay hidden" id="overOverlay">
        <h2>游戏结束</h2>
        <div class="final-score" id="finalScore">0</div>
        <p id="overHint">不错的成绩！再来一局？</p>
        <button class="btn" id="restartBtn">再来一局</button>
      </div>
    </div>

    <!-- 操作提示 -->
    <div class="hint">
      <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动</span>
      <span><kbd>Space</kbd> 暂停/继续</span>
    </div>

    <!-- 移动端方向键 -->
    <div class="touch-controls" id="touchControls">
      <div class="touch-btn" data-dir="up">▲</div>
      <div class="touch-btn" data-dir="left">◀</div>
      <div class="touch-btn" data-dir="right">▶</div>
      <div class="touch-btn" data-dir="down">▼</div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const canvasWrap = document.getElementById('canvasWrap');

      // ---- 游戏参数 ----
      const GRID = 20;           // 每格像素
      let COLS = 20, ROWS = 20;  // 网格行列数（动态适配）
      let snake, dir, nextDir, food, score, highScore, running, paused, gameOver;
      let stepInterval, lastStepTime, rafId;
      let foodPulse = 0;

      // ---- 初始化画布尺寸 ----
      function resizeCanvas() {
        const availW = Math.min(window.innerWidth - 32, 500);
        const availH = window.innerHeight;
        // 尽量用正方形
        let size = Math.min(availW, availH - 220);
        size = Math.max(size, 280);
        size = Math.floor(size / GRID) * GRID;
        COLS = ROWS = size / GRID;
        canvas.width = size;
        canvas.height = size;
        canvasWrap.style.width = size + 'px';
        canvasWrap.style.height = size + 'px';
      }

      // ---- 游戏状态重置 ----
      function resetGame() {
        const mid = Math.floor(COLS / 2);
        snake = [
          { x: mid, y: mid },
          { x: mid - 1, y: mid },
          { x: mid - 2, y: mid }
        ];
        dir = { x: 1, y: 0 };
        nextDir = { x: 1, y: 0 };
        score = 0;
        gameOver = false;
        paused = false;
        stepInterval = 130;
        lastStepTime = 0;
        foodPulse = 0;
        spawnFood();
        updateScoreUI();
        document.getElementById('pauseTag').classList.remove('show');
      }

      // ---- 随机生成食物 ----
      function spawnFood() {
        let pos;
        let tries = 0;
        do {
          pos = {
            x: Math.floor(Math.random() * COLS),
            y: Math.floor(Math.random() * ROWS)
          };
          tries++;
        } while (snake.some(s => s.x === pos.x && s.y === pos.y) && tries < 200);
        food = pos;
      }

      // ---- 核心游戏步进 ----
      function step() {
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        // 撞墙
        if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
          return endGame();
        }
        // 撞自身
        for (let i = 0; i < snake.length; i++) {
          if (snake[i].x === head.x && snake[i].y === head.y) {
            return endGame();
          }
        }

        snake.unshift(head);

        // 吃到食物
        if (head.x === food.x && head.y === food.y) {
          score += 10;
          updateScoreUI();
          // 每 50 分加速
          if (score % 50 === 0 && stepInterval > 60) {
            stepInterval -= 8;
          }
          spawnFood();
        } else {
          snake.pop(); // 没吃到，移除尾部
        }
      }

      // ---- 绘制 ----
      function draw() {
        // 背景
        ctx.fillStyle = getCss('--bg-grid');
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 网格线
        ctx.strokeStyle = 'rgba(124, 77, 255, 0.06)';
        ctx.lineWidth = 1;
        for (let i = 1; i < COLS; i++) {
          ctx.beginPath();
          ctx.moveTo(i * GRID, 0);
          ctx.lineTo(i * GRID, canvas.height);
          ctx.stroke();
        }
        for (let j = 1; j < ROWS; j++) {
          ctx.beginPath();
          ctx.moveTo(0, j * GRID);
          ctx.lineTo(canvas.width, j * GRID);
          ctx.stroke();
        }

        // 食物（带脉冲光晕）
        foodPulse += 0.06;
        const pulseR = Math.sin(foodPulse) * 3 + 3;
        const fx = food.x * GRID + GRID / 2;
        const fy = food.y * GRID + GRID / 2;

        // 光晕
        const glow = ctx.createRadialGradient(fx, fy, 1, fx, fy, GRID + pulseR);
        glow.addColorStop(0, 'rgba(255, 82, 82, 0.5)');
        glow.addColorStop(1, 'rgba(255, 82, 82, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(fx - GRID - 4, fy - GRID - 4, GRID * 2 + 8, GRID * 2 + 8);

        // 食物本体
        ctx.fillStyle = getCss('--food');
        ctx.beginPath();
        ctx.arc(fx, fy, GRID / 2 - 3, 0, Math.PI * 2);
        ctx.fill();
        // 高光
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.beginPath();
        ctx.arc(fx - 2, fy - 2, GRID / 5, 0, Math.PI * 2);
        ctx.fill();

        // 蛇身
        for (let i = snake.length - 1; i >= 0; i--) {
          const seg = snake[i];
          const sx = seg.x * GRID;
          const sy = seg.y * GRID;
          const pad = 1.5;
          const r = 5;

          if (i === 0) {
            // 蛇头：渐变 + 眼睛
            const grad = ctx.createLinearGradient(sx, sy, sx + GRID, sy + GRID);
            grad.addColorStop(0, getCss('--snake'));
            grad.addColorStop(1, getCss('--snake-dark'));
            ctx.fillStyle = grad;
            roundRect(sx + pad, sy + pad, GRID - pad * 2, GRID - pad * 2, r);
            ctx.fill();

            // 眼睛
            ctx.fillStyle = '#0a0a0a';
            const ex = sx + GRID / 2;
            const ey = sy + GRID / 2;
            const off = 3;
            let e1x, e1y, e2x, e2y;
            if (dir.x === 1)       { e1x = ex + off; e1y = ey - off; e2x = ex + off; e2y = ey + off; }
            else if (dir.x === -1) { e1x = ex - off; e1y = ey - off; e2x = ex - off; e2y = ey + off; }
            else if (dir.y === 1)  { e1x = ex - off; e1y = ey + off; e2x = ex + off; e2y = ey + off; }
            else                   { e1x = ex - off; e1y = ey - off; e2x = ex + off; e2y = ey - off; }
            ctx.beginPath(); ctx.arc(e1x, e1y, 2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(e2x, e2y, 2, 0, Math.PI * 2); ctx.fill();
          } else {
            // 蛇身：随距离渐暗
            const t = Math.min(i / snake.length, 0.6);
            const alpha = 1 - t * 0.5;
            ctx.fillStyle = `rgba(0, 230, 118, ${alpha})`;
            roundRect(sx + pad, sy + pad, GRID - pad * 2, GRID - pad * 2, r);
            ctx.fill();
          }
        }
      }

      // ---- 圆角矩形辅助 ----
      function roundRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
      }

      function getCss(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
      }

      // ---- 主循环 ----
      function loop(timestamp) {
        if (!running) return;
        rafId = requestAnimationFrame(loop);

        if (!paused && !gameOver) {
          if (timestamp - lastStepTime >= stepInterval) {
            step();
            lastStepTime = timestamp;
          }
        }
        draw();
      }

      // ---- 游戏结束 ----
      function endGame() {
        gameOver = true;
        running = false;
        cancelAnimationFrame(rafId);
        draw();

        const overlay = document.getElementById('overOverlay');
        document.getElementById('finalScore').textContent = score;

        // 高分判断
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('snake_high', highScore);
          updateScoreUI();
          document.getElementById('overHint').textContent = '🏆 创造新纪录！';
        } else {
          document.getElementById('overHint').textContent = score > 0
            ? '不错的成绩！再来一局？'
            : '别灰心，再试试看！';
        }
        overlay.classList.remove('hidden');
      }

      // ---- UI 更新 ----
      function updateScoreUI() {
        document.getElementById('score').textContent = score;
        document.getElementById('highScore').textContent = highScore;
      }

      // ---- 开始游戏 ----
      function startGame() {
        document.getElementById('startOverlay').classList.add('hidden');
        document.getElementById('overOverlay').classList.add('hidden');
        resetGame();
        running = true;
        lastStepTime = performance.now();
        rafId = requestAnimationFrame(loop);
      }

      // ---- 暂停切换 ----
      function togglePause() {
        if (!running || gameOver) return;
        paused = !paused;
        document.getElementById('pauseTag').classList.toggle('show', paused);
        if (!paused) lastStepTime = performance.now();
      }

      // ---- 方向控制 ----
      function setDirection(dx, dy) {
        // 防止 180° 反向
        if (dx === -dir.x && dy === -dir.y) return;
        nextDir = { x: dx, y: dy };
      }

      // ---- 键盘 ----
      document.addEventListener('keydown', function (e) {
        const key = e.key.toLowerCase();
        const map = {
          'arrowup': [0, -1], 'w': [0, -1],
          'arrowdown': [0, 1], 's': [0, 1],
          'arrowleft': [-1, 0], 'a': [-1, 0],
          'arrowright': [1, 0], 'd': [1, 0],
        };
        if (map[key]) {
          e.preventDefault();
          setDirection(map[key][0], map[key][1]);
        } else if (key === ' ') {
          e.preventDefault();
          togglePause();
        }
      });

      // ---- 触摸方向键 ----
      document.querySelectorAll('.touch-btn').forEach(function (btn) {
        btn.addEventListener('touchstart', function (e) {
          e.preventDefault();
          const dirMap = {
            up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0]
          };
          const d = dirMap[btn.dataset.dir];
          if (d) setDirection(d[0], d[1]);
        }, { passive: false });
      });

      // ---- 滑动手势（画布上） ----
      let touchStart = null;
      canvas.addEventListener('touchstart', function (e) {
        const t = e.touches[0];
        touchStart = { x: t.clientX, y: t.clientY };
      }, { passive: true });
      canvas.addEventListener('touchend', function (e) {
        if (!touchStart) return;
        const t = e.changedTouches[0];
        const dx = t.clientX - touchStart.x;
        const dy = t.clientY - touchStart.y;
        if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
        if (Math.abs(dx) > Math.abs(dy)) {
          setDirection(dx > 0 ? 1 : -1, 0);
        } else {
          setDirection(0, dy > 0 ? 1 : -1);
        }
        touchStart = null;
      }, { passive: true });

      // ---- 按钮 ----
      document.getElementById('startBtn').addEventListener('click', startGame);
      document.getElementById('restartBtn').addEventListener('click', startGame);

      // ---- 窗口大小变化 ----
      window.addEventListener('resize', function () {
        resizeCanvas();
        if (!running) draw();
      });

      // ---- 启动 ----
      highScore = parseInt(localStorage.getItem('snake_high') || '0', 10) || 0;
      resizeCanvas();
      resetGame();
      draw();
    })();
  </script>
</body>
</html>
