<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0);
      overflow: hidden;
    }

    canvas {
      display: block;
      /* 高清 canvas:平滑缩放,不做 crisp-edges 像素化 */
      image-rendering: auto;
      image-rendering: -webkit-optimize-contrast;
    }
  </style>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <!-- 三个渲染库改成本地文件（assets/_libs），不依赖外网 CDN：
       断网/代理慢时页面会卡在第一个外链脚本上，脚本不执行 → canvas 不创建 → 白屏。 -->
  <script src="assets/_libs/pixi-6.5.10.min.js"></script>
  <script src="assets/_libs/live2dcubismcore.min.js"></script>
  <script src="assets/_libs/pixi-live2d-display-0.4.0-cubism4.min.js"></script>
  <!-- 命令入口占位：本页脚本尚未执行到定义处时，Python 侧投递的命令先落到空函数。
       否则每次新建渲染页都会刷几十条 "setPetCommand is not defined"，既污染日志也拖慢主线程。 -->
  <script>window.setPetCommand = window.setPetCommand || function () {};</script>
</head>

<body>
  <script>
    // ============ QWebChannel 桥 ============
    window.bridge = null;
    if (typeof QWebChannel !== 'undefined' && typeof qt !== 'undefined') {
      new QWebChannel(qt.webChannelTransport, function (channel) {
        window.bridge = channel.objects.bridge;
      });
    }

    // ============ pixi-live2d 运行时诊断（只输出 console，不修改任何库配置）============
    // 重要：**不修改 PIXI.live2d.config**——第三方库内部配置（如 useRegister/maxTextureSize）
    // 在不同库版本/电脑上不一定存在，修改它既不适用其他人也不稳定。
    // 这里仅做诊断：把运行时 MAX_TEXTURE_SIZE 和默认配置打印到 console，方便定位错乱模型特征。
    function _diagnoseConfig(model3Url, pixiApp) {
      // 从 WebGL 拿 GPU 能力
      var maxTex = 8192;
      try {
        var gl = pixiApp.renderer.gl;
        if (gl) maxTex = gl.getParameter(gl.MAX_TEXTURE_SIZE) || 8192;
      } catch (e) { }
      console.log('[Live2D Diagnose] MAX_TEXTURE_SIZE from WebGL:', maxTex);

      console.log('[Live2D Diagnose] model3.json URL:', model3Url);
      // pixi-live2d 默认 config 快照（只读不改）
      try {
        var cfg = window.PIXI.live2d.config;
        console.log('[Live2D Diagnose] default PIXI.live2d.config:', JSON.stringify({
          useRegister: cfg.useRegister,
          maxTextureSize: cfg.maxTextureSize,
          autoInteract: cfg.autoInteract,
          sound: cfg.sound,
          motionSync: cfg.motionSync
        }));
      } catch (e) { }
    }

    // ============ 全局状态 ============
    var model = null;
    var app = null;
    var fitScale = 1.0;       // 模型适配画布的基础缩放（画布尺寸变化时重算）
    var modelBaseW = 0, modelBaseH = 0;   // 模型原始（未缩放）尺寸，避免重复缩放
    var targetW = 0, targetH = 0;
    // === 全屏 Stage 架构 ===
    // Electron 窗口固定覆盖整块显示器；模型画在自己的 Stage 里，
    // ClipBox 决定动画里全屏黑贴图是否被裁掉（local=只看 Stage，full=整屏）。
    var _layoutStage = { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight };
    var _layoutClip = { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight };
    var _layoutMode = 'local';
    var _layoutSeq = -1;
    function _winOrigin() {
      return { x: (typeof window.screenX === 'number') ? window.screenX : 0,
               y: (typeof window.screenY === 'number') ? window.screenY : 0 };
    }
    // Stage 的屏幕坐标（Python 的 stage_rect() 与之同一套坐标系）
    function _stageScreenRect() {
      var st = _layoutStage;
      return [Math.round(st.x), Math.round(st.y),
              Math.round(Math.max(1, st.w)), Math.round(Math.max(1, st.h))];
    }
    function _layoutStageLocal() {
      var o = _winOrigin();
      return { x: _layoutStage.x - o.x, y: _layoutStage.y - o.y,
               w: Math.max(1, _layoutStage.w), h: Math.max(1, _layoutStage.h) };
    }
    function _layoutClipLocal() {
      if (_layoutMode === 'full') {
        return { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight };
      }
      var o = _winOrigin();
      return { x: _layoutClip.x - o.x, y: _layoutClip.y - o.y,
               w: Math.max(1, _layoutClip.w), h: Math.max(1, _layoutClip.h) };
    }
    function _parseRect(v, fallback) {
      if (Array.isArray(v) && v.length === 4) {
        return { x: Number(v[0]), y: Number(v[1]), w: Number(v[2]), h: Number(v[3]) };
      }
      if (typeof v === 'string' && v.trim()) {
        var p = v.split(',').map(function (s) { return Number(s.trim()); });
        if (p.length === 4 && p.every(function (n) { return isFinite(n); })) {
          return { x: p[0], y: p[1], w: p[2], h: p[3] };
        }
      }
      return fallback;
    }
    // 画面延迟统计：Python 下发布局时带墙钟 t，这里在真正应用时回算
    // "下发→应用"的差值 = 光标移动后画面追上来的延迟（诊断用，只记数字不打印）。
    var _lagStat = window.__lagStat = { n: 0, sum: 0, max: 0, last: 0, n_old: 0 };
    function _applyPetLayout(data) {
      if (!data) return false;
      var seq = Number(data.seq);
      if (isFinite(seq) && seq >= 0) {
        if (seq < _layoutSeq) { _lagStat.n_old++; return false; }   // 旧布局迟到，丢弃
        _layoutSeq = seq;
      }
      _layoutStage = _parseRect(data.stage, _layoutStage);
      _layoutMode = (data.mode === 'full') ? 'full' : 'local';
      _layoutClip = _parseRect(data.clip,
        (_layoutMode === 'full')
          ? { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight }
          : _layoutStage);
      _applyCanvasClip();
      _invalidateHitFrame();
      if (model && app) applyFit();
      // 拖拽惯性：把 Stage 位移喂给摆动器（拖动 / 命令位移都会走这里）
      try { _swayFeed(_layoutStage.x, _layoutStage.y); } catch (e) { }
      try {
        var _t0 = Number(data.t);
        if (isFinite(_t0) && _t0 > 0) {
          var _lg = Date.now() - _t0;
          if (_lg >= 0 && _lg < 5000) {
            _lagStat.n++; _lagStat.sum += _lg; _lagStat.last = _lg;
            if (_lg > _lagStat.max) _lagStat.max = _lg;
          }
        }
      } catch (e) { }
      return true;
    }
    function _applyCanvasClip() {
      if (!app || !app.view) return;
      if (_layoutMode === 'full') {
        app.view.style.clipPath = 'none';
        return;
      }
      var c = _layoutClipLocal();
      var left = Math.max(0, c.x);
      var top = Math.max(0, c.y);
      var right = Math.max(0, window.innerWidth - (c.x + c.w));
      var bottom = Math.max(0, window.innerHeight - (c.y + c.h));
      app.view.style.clipPath = 'inset(' + top + 'px ' + right + 'px ' +
                                bottom + 'px ' + left + 'px)';
    }
    window.__applyPetLayout = _applyPetLayout;
    var _suspendedFrames = false;   // true=画布分辨率调整中，暂停帧推送（避免空白帧闪动）
    var _glLost = false;            // true=WebGL 上下文已丢失（此状态下的画面必须重建）
    var _intentionalLost = false;   // true=我们自己主动丢上下文（切换重建中，不算故障）
    var _GL_REBUILD_MAX = 2;        // 连续重建上限，防止上下文反复丢失时无限刷新
    var _switchSeq = 0;             // 模型切换序号：丢弃过期加载结果，避免并发切换互相覆盖
    var _switchBusy = false;        // true=模型切换中，暂停帧推送（避免空白/残帧闪动）
    var _modelJsonUrl = "";         // 当前模型 model3.json 的 URL（资产元数据来源）
    var _modelReady = false;        // 当前模型是否已加载完成（getAssets/model_ready）
    var _lastSwitchError = "";      // 最近一次模型加载/切换的错误信息（诊断用）
    var _hiddenParts = [];          // 运行时隐藏的部件 [{id, index}]（兼容旧命令）
    var _hiddenDrawables = [];      // 运行时隐藏的单个网格（drawable 索引），优先使用
    var _highlightGfx = null;       // 选中部件的轮廓高亮（PIXI.Graphics）
    var _highlight = { active: false, partIndex: -1, drawableIndex: -1 };
    // 同一像素上重叠多个网格时，靠「同位置重复点击」在它们之间循环
    var _pickCycle = { sx: -1e9, sy: -1e9, list: [], pos: 0 };

    function _resetPickCycle() {
      _pickCycle.sx = -1e9;
      _pickCycle.sy = -1e9;
      _pickCycle.list = [];
      _pickCycle.pos = 0;
    }

    // ============ 帧推送：原始 RGBA POST（主）+ PNG dataURL（回退）============
    // 旧链路每帧 PNG 编码 65ms + Python 解码 32ms ≈ 9fps。
    // 新链路直接 gl.readPixels（≈9ms @1050x1200）→ fetch POST 原始字节
    // （≈2.5ms + 9.5ms/MB），Python 侧零解码，实测可到 25~40fps。
    // 注意：readPixels 行序自下而上（OpenGL 原点在左下），Python 侧用
    // QPainter scale(1,-1) 镜像绘制，负 stride 的 QImage 会崩（已实测）。
    var _framePort = 0;      // >0 = 原始帧 HTTP 端点可用
    var _frameToken = '';    // 实例令牌：只让本实例的后端接收我的帧
    var _rawOk = true;       // false = 回退 PNG dataURL 通道
    var _rawFail = 0;        // 连续失败计数（≥3 判定端点不可用）
    var _directMode = false; // true = 可见窗口直出，不推帧、不读像素

    // main/Python 在 setBounds 之后通过 /eval 写这个属性。用 setter 是为了
    // 在赋值当下立刻重算模型位置，而不是等下一帧 ticker —— 窗口位置已经
    // 变了、内容尺寸还没变的这一帧如果按旧中心画，就会先偏左上/右下。
    var _petTarget = null;
    // 目标几何的单调序号：Python 侧的动画步进（异步线程）和最终几何
    // （Qt 主线程同步 /eval）是两条独立通道，晚到的旧步进可能覆盖新目标，
    // 模型就会先偏到旧几何再被弹回（滚轮放大偏左上、缩小偏右下）。
    // 只接受序号单调递增的写入，乱序/过期的目标一律丢弃。
    var _petSeq = -1;
    try {
      Object.defineProperty(window, '__petTarget', {
        configurable: true,
        get: function () { return _petTarget; },
        set: function (v) {
          if (v && typeof v === 'object' && v.seq != null) {
            if (v.seq < _petSeq) return;   // 过期/乱序目标：忽略
            if (v.seq > _petSeq) _petSeq = v.seq;
          }
          _petTarget = v;
          if (typeof _applyTargetCompensation === 'function') _applyTargetCompensation();
        }
      });
    } catch (e) { /* 不支持 defineProperty 时退回 ticker 补偿 */ }
    var _pushOn = true;      // Python 侧窗口隐藏时下发 setPush{on:false} 停推
    var _inFlight = false;   // 背压：上一帧响应未回来前不再发新请求
    var _again = false;      // 期间又出新帧 → 响应回来时补推最新一帧
    var _pixBuf = null;      // 复用的像素缓冲（尺寸变化时重建）
    var _pixW = 0, _pixH = 0;

    // ---- 回传裁剪（清晰度与帧率的共同解法）----
    // Live2D 画布是 6500×6500 的方形，实测人物只占画布 41%，其余全是透明。
    // 以前为了帧率把整幅画布降到 0.5× 传，结果被放大显示 → 发虚。
    // 现在画布永远 ≥ 窗口像素（不缩），改成"只回传有内容的那块"：
    // 扫描回读缓冲的 alpha 求包围盒，帧体积≈41%，等于白拿 2.4 倍带宽。
    // 包围盒由真实像素算出（不依赖各家模型的顶点坐标约定），并且：
    //   · 内容贴到裁剪边界 → 立刻向外扩（绝不裁掉东西）
    //   · 明显变小 → 连续两次采样都成立才缩小（防抖动/防来回改查询参数）
    var _crop = {on: true, valid: false, x: 0, y: 0, w: 0, h: 0,
                 scan: 0, shrink: 0, pad: 16};

    function _cropReset() {
      _crop.valid = false;
      _crop.scan = 0;
      _crop.shrink = 0;
    }

    // 扫回读缓冲的 alpha，返回画布坐标（左上原点）下的不透明包围盒
    function _scanOpaqueRect(buf, w, h, ox, oy) {
      var stride = (w > 900 || h > 900) ? 8 : 6;
      var minX = 1e9, minY = 1e9, maxX = -1, maxY = -1;
      for (var y = 0; y < h; y += stride) {
        var row = y * w * 4;
        for (var x = 0; x < w; x += stride) {
          if (buf[row + x * 4 + 3] > 6) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) return null;
      // 光栅行序自下而上（OpenGL 原点左下）→ 转成左上原点的 y
      var yTop = oy + (h - 1 - maxY);
      return {
        x: ox + minX, y: yTop,
        w: maxX - minX + 1, h: maxY - minY + 1,
        // 贴边 = 内容可能已经被裁掉（下一轮必须往外扩）
        touch: (minX <= stride) || (minY <= stride) ||
               (maxX + stride >= w) || (maxY + stride >= h)
      };
    }

    function _cropUnion(a, b) {
      var x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
      var r = Math.max(a.x + a.w, b.x + b.w);
      var d = Math.max(a.y + a.h, b.y + b.h);
      return {x: x, y: y, w: r - x, h: d - y};
    }

    // 每 N 帧根据当前回读帧更新裁剪框（成本 ≈0.2ms，节流到 ≈0.25s 一次）
    function _updateCropFromFrame() {
      if (!_crop.on || !_pixBuf || !_pixW || !_pixH) return;
      var wh = _canvasSize();
      var cw = wh[0], ch = wh[1];
      if (!cw || !ch) return;
      _crop.scan++;
      if (_crop.scan % 8 !== 0 && _crop.valid) return;

      var cur = _crop.valid
        ? {x: _crop.x, y: _crop.y, w: _crop.w, h: _crop.h}
        : {x: 0, y: 0, w: cw, h: ch};
      var r = _scanOpaqueRect(_pixBuf, _pixW, _pixH, cur.x, cur.y);
      if (!r) return;                    // 全透明（切换/隐藏中）：保持现状

      var pad = _crop.pad;
      var grow = {x: r.x - pad, y: r.y - pad, w: r.w + pad * 2, h: r.h + pad * 2};
      // 吸附到 4px 网格：避免 1px 抖动引发无意义的查询参数变化
      grow.x = Math.floor(grow.x / 4) * 4;
      grow.y = Math.floor(grow.y / 4) * 4;
      grow.w = Math.ceil(grow.w / 4) * 4 + 4;
      grow.h = Math.ceil(grow.h / 4) * 4 + 4;
      if (grow.x < 0) { grow.w += grow.x; grow.x = 0; }
      if (grow.y < 0) { grow.h += grow.y; grow.y = 0; }
      if (grow.x + grow.w > cw) grow.w = cw - grow.x;
      if (grow.y + grow.h > ch) grow.h = ch - grow.y;
      if (grow.w * grow.h >= cw * ch * 0.98) {      // 裁不出多少 → 直接整幅
        _crop.valid = false;
        return;
      }

      if (!_crop.valid) {
        _crop.x = grow.x; _crop.y = grow.y; _crop.w = grow.w; _crop.h = grow.h;
        _crop.valid = true;
        _crop.shrink = 0;
        return;
      }

      var contained = (grow.x >= cur.x && grow.y >= cur.y &&
                       grow.x + grow.w <= cur.x + cur.w &&
                       grow.y + grow.h <= cur.y + cur.h);
      if (r.touch || !contained) {
        // 只扩不缩：并集里再夹一次画布边界
        var u = _cropUnion(cur, grow);
        u.x = Math.max(0, u.x); u.y = Math.max(0, u.y);
        u.w = Math.min(cw - u.x, u.w); u.h = Math.min(ch - u.y, u.h);
        _crop.x = u.x; _crop.y = u.y; _crop.w = u.w; _crop.h = u.h;
        _crop.shrink = 0;
        return;
      }

      // 明显变小（面积 <80%）：连续两次采样确认后才缩，避免呼吸引发的抖动
      if (grow.w * grow.h < _crop.w * _crop.h * 0.8) {
        _crop.shrink++;
        if (_crop.shrink >= 2) {
          _crop.x = grow.x; _crop.y = grow.y; _crop.w = grow.w; _crop.h = grow.h;
          _crop.shrink = 0;
          if (_crop.w * _crop.h >= cw * ch * 0.98) _crop.valid = false;
        }
      } else {
        _crop.shrink = 0;
      }
    }

    function setFrameEndpoint(port, token) {
      port = parseInt(port, 10) || 0;
      _framePort = port;
      if (token) _frameToken = String(token);
      _rawOk = port > 0;
      _rawFail = 0;
      _inFlight = false;
      _again = false;
    }

    function setPush(on) { _pushOn = !!on; }

    function _canvasSize() {
      var gl = app && app.renderer && app.renderer.gl;
      if (!gl) return [0, 0];
      return [gl.drawingBufferWidth | 0, gl.drawingBufferHeight | 0];
    }

    // 直出模式只在“需要热区/自检”时抓一帧，绝不进入每帧显示链路。
    // 用途：双击热区需要 alpha 判断哪些格子是模型实体；一次性 readPixels
    // 后缓存到 _pixBuf，后续 getClickMap 复用，正常渲染仍然零 readPixels。
    function _invalidateHitFrame() {
      // Stage/Clip 一变，模型在画布上的位置就变了；旧 readPixels 缓存里
      // 还是上一个位置的 alpha，必须作废，否则鼠标命中会停在旧位置。
      _pixBuf = null;
      _pixW = 0;
      _pixH = 0;
    }
    function _captureClickFrame() {
      if (_pixBuf && _pixW && _pixH) return true;
      if (!app || !app.renderer || !model) return false;
      var gl = app.renderer.gl;
      var wh = _canvasSize();
      var cw = wh[0], ch = wh[1];
      if (!cw || !ch) return false;
      try {
        // 直出时 preserveDrawingBuffer=false，先重绘一帧再读；
        // 这是诊断/热区专用的一次性开销，不改变显示路径。
        app.renderer.render(app.stage);
        // readPixels 是同步 GPU→CPU，耗时与读的面积成正比：整块画布
        // （1920×1080×4=8.3MB）实测 300~1200ms，等于把渲染层冻住一次。
        // 只读 Stage ∪ 模型包围盒那一块（_hitBand 就是这个范围，必须比
        // _stageBand 宽，否则"模型比 Stage 宽出来的那截"会被读成透明、
        // 命中区漏边 → 就是之前那个"看得见却点不到"）。全屏时它是整屏
        // 8.3MB，Stage 尺寸下约 2.1MB，实测 300ms → 75ms 级。
        // 推送模式（QWebEngine 既不用 Electron）里 _crop 是帧推送自己的裁剪框，
        // 这里不能动它，整幅读保持原样；只有直出模式才按 band 收窄。
        var band = _directMode ? _hitBand() : { x0: 0, y0: 0, x1: 1, y1: 1 };
        var rx = Math.max(0, Math.floor(band.x0 * cw) - 8);
        var ry = Math.max(0, Math.floor(band.y0 * ch) - 8);
        var rw = Math.min(cw - rx, Math.ceil((band.x1 - band.x0) * cw) + 16);
        var rh = Math.min(ch - ry, Math.ceil((band.y1 - band.y0) * ch) + 16);
        if (rw < 8 || rh < 8) { rx = 0; ry = 0; rw = cw; rh = ch; }
        _pixBuf = new Uint8Array(rw * rh * 4);
        _pixW = rw;
        _pixH = rh;
        // 采样路径统一用 _crop 做"画布坐标→缓冲坐标"的偏移换算
        _crop.valid = true;
        _crop.x = rx;
        _crop.y = ry;
        _crop.w = rw;
        _crop.h = rh;
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.readPixels(rx, ch - (ry + rh), rw, rh, gl.RGBA, gl.UNSIGNED_BYTE, _pixBuf);
        return true;
      } catch (e) {
        _pixBuf = null;
        _pixW = 0;
        _pixH = 0;
        _crop.valid = false;
        return false;
      }

    var _SWAY_VDEAD = 45;       // 死区：比这更慢完全不摆（正常慢拖应该几乎看不出来）
    var _SWAY_EXP = 1.25;       // >1 让中低速更轻、高速更狠（线性=1）

    // === 平滑化（v0.8.1）===
    // 摆动"卡顿"不是采样频率问题，而是**写进参数的数值序列不连续**：
    // ① 撞上限时硬夹 + 把速度清零 → 曲线顶部折角后突降；
    // ② 变步长积分，掉一帧就跨 3 倍步长 → 折角；
    // ③ 目标角随速度阶跃到满值 → 弹簧被"打"一下，输出带阶跃响应的高频成分；
    // ④ 速度由"喂位置"的间隔直接差分，而喂入频率本身不均匀 → 速度阶梯。
    // 对应四条改法：固定子步、软饱和（不清速度）、目标限速、软化位置估速。
    // 注意写入层保持"幂等总量"（基线 + out），不能改成累加增量：模型每帧
    // loadParameters() 重置参数，增量式会被不断稀释。
    var _SWAY_STEP = 1 / 120;   // 基准子步（s），仅用于无帧长信息时的兜底
    var _SWAY_SUBSTEPS = 2;     // 每帧固定 2 个子步
    var _SWAY_DT_MAX = 0.033;   // 单帧最多按 33ms 推进：更长（挂起/切模型）直接丢弃
                                // 关键：h = 帧长 / 子步数 —— 每帧推进的物理时间与渲染帧严格相等，
                                // 不会再出现"这一帧走 2 步、下一帧走 3 步"导致的回落速度一快一慢
    var _TAU_V = 0.028;         // 速度 EMA 时间常数（比原来更短：起速快一点，峰值不被拖掉）
    var _SWAY_SLEW = 500;       // 目标角限速（°/s）：13° 需 26ms 爬完，既不是阶跃也跟得上
    var _SWAY_WRITE_EPS = 0.02; // 偏移小于这个角度（°）视为 0：静止时不写，避免每帧抹平动画值

    var _SWAY_DEFS = [
      { tag: 'bodyRoll', match: /^ParamBodyAngleZ$/, axis: 'x', K: 40, C: 7.6, max: 13 },
      { tag: 'bodyPitch', match: /^ParamBodyAngleX$/, axis: 'y', K: 40, C: 7.6, max: 10 },
      { tag: 'headRoll', match: /^ParamAngleZ$/, axis: 'x', K: 55, C: 9.4, max: 7 },
      { tag: 'headTilt', match: /^ParamAngleY$/, axis: 'y', K: 55, C: 9.4, max: 5 },
      { tag: 'hair', match: /hair|ahoge|pigtail/i, axis: 'x', K: 16, C: 3.4, max: 1.6, soft: true },
      { tag: 'cloth', match: /skirt|cloth|dress|ribbon|scarf|cape|sleeve|tail/i,
        axis: 'x', K: 17, C: 3.6, max: 1.2, soft: true }
    ];

    function _swayAllParams() {
      try {
        var p = model.internalModel.coreModel._model.parameters;
        return (p && p.ids) ? p.ids : [];
      } catch (e) { return []; }
    }

    // 模型换掉后重新解析：哪些参数真的存在（不存在就静默跳过，绝不误写 0 号参数）
    function _swayInit() {
      var ids = _swayAllParams();
      var ch = [];
      for (var i = 0; i < _SWAY_DEFS.length; i++) {
        var d = _SWAY_DEFS[i];
        var hit = [];
        for (var k = 0; k < ids.length; k++) {
          if (d.match.test(ids[k])) hit.push(ids[k]);
        }
        if (d.tag === 'hair' || d.tag === 'cloth') hit = hit.slice(0, 8);   // 别一次改几十个参数
        for (var h = 0; h < hit.length; h++) {
          // 按参数真实量程收敛幅度，但**必须按"默认值到最近边界的距离"算**，不能用总量程：
          // 参数范围经常不对称（如 ParamBodyAngleZ = [-10, 30]，中心 0 往下只剩 10），
          // 用总量程 42% 会算出 16.8，写到 -13 就被硬夹到 -10 —— 一半摆幅被削平，
          // 看上去就是"摆到一边就卡住/抖一下"；单向参数（如 Hair_physics = [0,1]）
          // 更是负半周全部被夹成 0，整条通道等于没有。
          var inf = paramInfo(hit[h]);
          var d0 = getParamDefault(hit[h]);
          var lo = (inf && inf.min !== null) ? Math.abs(d0 - inf.min) : null;
          var hi = (inf && inf.max !== null) ? Math.abs(inf.max - d0) : null;
          var avail = (lo === null || hi === null) ? d.max : Math.min(lo, hi);
          var cap = Math.min(d.max, avail * 0.82);   // 留 18% 余量，任何一帧都碰不到边界
          // 余量小到根本没有摆动空间（单向参数、量程极窄的"开关型"参数）→ 直接跳过，
          // 不要把它算进通道：写进去只会被夹，模型看着像没惯性
          if (!(cap > d.max * 0.1)) continue;
          ch.push({
            tag: d.tag, param: hit[h], axis: d.axis, K: d.K, C: d.C,
            max: cap, soft: !!d.soft,
            x: 0, v: 0, tv: 0          // tv = 上一子步的目标角（限速基准）
          });
        }
      }
      _sway.ch = ch;
      _sway.peak = {};
      _sway.applied = {};
      _sway.wrote = {};
      _sway.init = ch.length > 0;
      // 软化位置从当前 Stage 起算，避免第一帧速度爆表
      _sway.tx = _layoutStage.x; _sway.ty = _layoutStage.y;
      _sway.vx = 0; _sway.vy = 0;
      _sway.last = 0; _sway.acc = 0;
      _sway.fedN = 0; _sway.fedDtMax = 0; _sway.maxStep = 0;
      _sway.maxJerk = 0; _sway.lastOut = {}; _sway.lastOut2 = {}; _sway.trace = [];
      _sway.traceParam = _SWAY_TRACE_PARAM;
      try {
        console.log('[sway] 通道=' + ch.length + ' 参数=' +
                    ch.map(function (c) { return c.tag + ':' + c.param; }).join(','));
      } catch (e) { }
      return ch.length;
    }

    // Stage 位置更新时喂**目标位置**（拖动 / 命令位移 / 滚轮缩放位移都会走这里）。
    // 速度就在这里按真实间隔算：dx/dt 做 EMA。不要在子步里拿"软位置差分"估速——
    // 那是把速度再降采样一遍，稀疏喂入时软位置先追平、速度就被抹成 0，
    // 于是目标角忽高忽低，摆动看上去就是抖的。
    function _swayFeed(x, y) {
      var now = performance.now();
      if (!_sway.t) {
        _sway.t = now;
        _sway.tx = x; _sway.ty = y;
        _sway.fed = true;
        return;
      }
      var dt = (now - _sway.t) / 1000;
      _sway.fedN++;
      // 只统计"拖动过程中"的间隔：reset 后第一次喂位置会隔着几秒，不该算进去
      if (dt < 0.25 && dt * 1000 > _sway.fedDtMax) _sway.fedDtMax = dt * 1000;
      var dx = x - _sway.tx, dy = y - _sway.ty;
      _sway.tx = x; _sway.ty = y; _sway.t = now;
      _sway.fed = true;
      if (dt > 0.0005 && dt < 0.25) {
        var kv = 1 - Math.exp(-dt / _TAU_V);
        _sway.vx += (dx / dt - _sway.vx) * kv;
        _sway.vy += (dy / dt - _sway.vy) * kv;
      }
    }

    // 速度 → 目标幅度比例（-1..1）。死区以下为 0；指数 >1 让轻拖更轻。
    function _swayVelRatio(v) {
      var a = Math.abs(v);
      if (a <= _SWAY_VDEAD) return 0;
      var r = (a - _SWAY_VDEAD) / (_SWAY_VREF - _SWAY_VDEAD);
      if (r > 1) r = 1;
      if (_SWAY_EXP !== 1) r = Math.pow(r, _SWAY_EXP);
      return v > 0 ? -r : r;   // 往右拖 → 身体向后（左）倾，方向与惯性相反
    }

    // 软饱和：把弹簧的原始角位移压进 ±max，但**不在边界上把速度清零**。
    // |u|<=0.75 完全线性（手感不变），往外 tanh 过渡到 1.0 —— 冲顶时曲线是圆的，
    // 不再出现"平顶后突降"那种顿感。u 可以短暂超过 1，弹簧自己会拉回来。
    function _swaySoft(u) {
      var a = Math.abs(u);
      if (a <= 0.75) return u;
      var s = 0.75 + 0.25 * Math.tanh((a - 0.75) / 0.25);
      return u > 0 ? s : -s;
    }

    // 一个物理子步：目标角限速 + 二阶弹簧。速度不在这里动，它由 _swayFeed 按真实
    // 位置采样更新、由 _swayTick 在无输入时慢慢衰减，所以这里对 h 是纯积分。
    function _swayStep(h) {
      // 每通道：目标角限速 + 二阶弹簧
      var maxd = _SWAY_SLEW * h;
      for (var i = 0; i < _sway.ch.length; i++) {
        var c = _sway.ch[i];
        var v = (c.axis === 'y') ? _sway.vy : _sway.vx;
        var ratio = _swayVelRatio(v);
        if (ratio > 1) ratio = 1;
        if (ratio < -1) ratio = -1;
        var tgt = ratio * c.max;
        // 目标限速：速度再跳，目标也按 ≤_SWAY_SLEW °/s 的斜线爬，弹簧看到连续激励
        var d = tgt - c.tv;
        if (d > maxd) tgt = c.tv + maxd;
        else if (d < -maxd) tgt = c.tv - maxd;
        c.tv = tgt;
        var acc = c.K * (tgt - c.x) - c.C * c.v;
        c.v += acc * h;
        c.x += c.v * h;
        if (!isFinite(c.x) || !isFinite(c.v)) { c.x = 0; c.v = 0; c.tv = 0; }
        // 数值安全边界（软饱和之后基本到不了）；不清速度，避免折角
        if (c.x > c.max * 1.8) c.x = c.max * 1.8;
        if (c.x < -c.max * 1.8) c.x = -c.max * 1.8;
        // 收尾对齐：偏移足够小就归零，避免一点点残值一直挂着（模型会显得歪着）
        if (Math.abs(c.x) < c.max * 0.004 && Math.abs(c.v) < 0.05) { c.x = 0; c.v = 0; c.tv = 0; }
      }
    }

    // sway 写的是「默认值 + 偏移」这个绝对值，谁在它前面写、谁就被抹平。
    // 这些参数如果正被更高优先级的写入者占用（内置动画/流式参数、平滑过渡、鼠标跟随），
    // sway 必须让路，否则就会出现「动画下发了却一动不动」：
    // 符玄就是典型 —— 它的 4 个姿态参数 ParamAngleZ / ParamAngleY / ParamBodyAngleX /
    // ParamBodyAngleZ 正好全被 sway 通道占用，于是歪头/摇摆/点头/欢呼的头身动作全被写回 0，
    // 只有未被 sway 占用的 ParamAngleX（摇头）和嘴角/眼睛参数能看见。
    function _swayBusyParams() {
      var busy = {};
      try {
        if (_stream.playing && _stream.count > 0) {
          for (var i = 0; i < _stream.params.length; i++) busy[_stream.params[i]] = 1;
        }
      } catch (e) { }
      for (var tn in _trackTargets) busy[tn] = 1;
      for (var wn in _tweenStates) busy[wn] = 1;
      return busy;
    }

    function _swayTick(now) {
      if (!_sway.on || !model || !_sway.init) return;
      if (!_sway.ch.length) return;
      if (!_sway.last) { _sway.last = now; return; }
      var real = (now - _sway.last) / 1000;
      _sway.last = now;
      if (!(real > 0)) real = _SWAY_STEP;
      if (real > _SWAY_DT_MAX) real = _SWAY_DT_MAX;   // 挂起/切模型：多余时间丢弃，不补步
      // 本帧没有新的位置输入 → 速度按 0.10^t 慢衰减（松手后自然收干净）。
      // 不设"松手判定"阈值：判定早了会在稀疏拖动时误判、把速度一段段砍掉，
      // 那正是摆动"顿一下"的来源；这里用"有没有输入"这个事实，不用时间去猜。
      if (!_sway.fed) {
        var decay = Math.pow(0.10, real);
        _sway.vx *= decay; _sway.vy *= decay;
        if (Math.abs(_sway.vx) < 0.5) _sway.vx = 0;
        if (Math.abs(_sway.vy) < 0.5) _sway.vy = 0;
      }
      _sway.fed = false;
      // 每帧固定 2 个子步、步长 = 帧长/2：推进的物理时间恒等于这一帧的时间
      var h = real / _SWAY_SUBSTEPS;
      for (var s = 0; s < _SWAY_SUBSTEPS; s++) _swayStep(h);

      // 统一成每参数合计的偏移（软饱和在这里做，弹簧状态保持原始）
      var out = {};
      for (var i = 0; i < _sway.ch.length; i++) {
        var c = _sway.ch[i];
        var y = c.max * _swaySoft(c.x / c.max);
        out[c.param] = (out[c.param] || 0) + y;
        var pk = _sway.peak[c.param] || 0;
        if (Math.abs(y) > Math.abs(pk)) _sway.peak[c.param] = y;
      }
      // 平滑度自检：单帧最大变化 + 二阶差分最大（验收"数值序列是否连续"用）
      for (var nm in out) {
        var dstep = Math.abs(out[nm] - (_sway.lastOut[nm] || 0));
        var d2 = Math.abs(out[nm] - 2 * (_sway.lastOut[nm] || 0) + (_sway.lastOut2[nm] || 0));
        if (dstep > _sway.maxStep) _sway.maxStep = dstep;
        if (d2 > _sway.maxJerk) _sway.maxJerk = d2;
      }
      _sway.lastOut2 = _sway.lastOut;
      _sway.lastOut = out;
      // 每帧轨迹（自检：把"参数数值序列"原样留一份，用于确认曲线连续）
      if (!_sway.trace) _sway.trace = [];
      var trv = out[_sway.traceParam || _SWAY_TRACE_PARAM];
      _sway.trace.push(trv === undefined ? 0 : Math.round(trv * 1000) / 1000);
      if (_sway.trace.length > _SWAY_TRACE_MAX) _sway.trace.shift();

      // 与更高优先级写入者冲突的参数：本帧不写、也不在收尾时补写默认值
      var busy = _swayBusyParams();
      for (var bp in busy) {

        if (_sway.applied[bp]) _sway.applied[bp] = 0;
      }

      // 写入用「参数默认值 + 偏移」这个确定量，不再拿 getParameterValueById 的结果当基线。
      // 原因：internalModel.update() 每帧 loadParameters() 重置、idle 动作和物理又各写一遍，
      // 读回来的 cur 里混着它们的逐帧变化，当基线就等于把这个抖动一起叠进摆动；
      // 而"幂等总量"写法还要靠 |cur - lastW| 判断两态，判错一次就是一个台阶。
      // 写 def + out 完全确定：out 衰减到 0 时写回 def，也不会有残值。
      for (var name in out) {
        var yv = out[name];
        var pv = _sway.applied[name] || 0;
        // 偏移小到看不见、上一帧也没有偏移 → 干脆不写（静止时不产生任何写入，
        // 才不会每帧把动画/跟随写到这些参数上的值抹成默认值）
        if (Math.abs(yv) < _SWAY_WRITE_EPS && Math.abs(pv) < _SWAY_WRITE_EPS) {
          if (_sway.applied[name] !== undefined) _sway.applied[name] = 0;
          continue;
        }
        var def = getParamDefault(name);
        applyParam(name, def + yv);
        _sway.wrote[name] = def + yv;
        _sway.applied[name] = yv;
      }
      // 本帧没有偏移的参数：写回默认值（同样确定，不加任何推断）
      for (var pn in _sway.applied) {
        if (out[pn] === undefined && _sway.applied[pn]) {
          var d2 = getParamDefault(pn);
          applyParam(pn, d2);
          _sway.wrote[pn] = d2;
          _sway.applied[pn] = 0;
        }
      }
    }

    function _swayState(cmd) {
      var st = {
        on: _sway.on,
        channels: _sway.ch.length,
        params: _sway.ch.map(function (c) { return c.tag + ':' + c.param; }),
        v: [Math.round(_sway.vx), Math.round(_sway.vy)],
        vratio: Math.round(_swayVelRatio(_sway.vx) * 1000) / 1000,
        vref: _SWAY_VREF, vdead: _SWAY_VDEAD,
        step: _SWAY_STEP, tauV: _TAU_V, slew: _SWAY_SLEW,
        feedN: _sway.fedN, feedDtMax: Math.round(_sway.fedDtMax * 10) / 10,
        maxStep: Math.round(_sway.maxStep * 10000) / 10000,
        maxJerk: Math.round(_sway.maxJerk * 10000) / 10000,
        traceParam: _sway.traceParam || _SWAY_TRACE_PARAM, trace: (_sway.trace || []).slice(),
        peak: {}, now: {}, applied: {}, abs: {}, caps: {}
      };
      for (var p in _sway.peak) st.peak[p] = Math.round(_sway.peak[p] * 1000) / 1000;
      for (var q in _sway.applied) st.applied[q] = Math.round(_sway.applied[q] * 1000) / 1000;
      for (var i = 0; i < _sway.ch.length; i++) {
        var c = _sway.ch[i];
        st.now[c.param] = Math.round(c.x * 1000) / 1000;
        st.abs[c.param] = Math.round(getParamValue(c.param) * 100) / 100;
        st.caps[c.param] = Math.round(c.max * 1000) / 1000;
      }
      if (cmd && cmd.traceParam) {
        _sway.traceParam = String(cmd.traceParam);
        _sway.trace = [];
      }
      if (cmd && cmd.reset) {

        _sway.fedN = 0; _sway.fedDtMax = 0; _sway.trace = [];
      }
      return st;
    }

    // ============ 平滑过渡引擎（低优先级）============
    var _tweenStates = {};  // {paramName: {from, to, start, duration}}
    // 配音口型锁：由 TTS 服务写入；每帧在模型 update 之后强制覆盖，避免动作自带口型抢嘴。
    var _mouthLock = null;
    // 不同模型的口型参数名不统一：guanghui_9 用 ParamMouthOpenY，
    // z23 用 PARAM_MOUTH_OPEN_Y / PARAM_MOUTH_FORM。按 id 归一后动态取真实参数名，
    // 不能把固定名字直接交给 setParameterValueById（不存在时会误写 0 号参数）。
    var _mouthParamIds = { open: '' };

    function smoothSetParams(params, ms) {
      var now = performance.now();
      for (var name in params) {
        if (ms === 0) {
          applyParam(name, params[name]);
          delete _tweenStates[name];
        } else {
          var current = getParamValue(name);
          _tweenStates[name] = { from: current, to: params[name], start: now, duration: ms };
        }
      }
    }

    function _tweenTick(now) {
      for (var name in _tweenStates) {
        // 流式动画运行时，跳过被流式控制的参数
        if (_stream.playing && _stream.params.indexOf(name) >= 0) {
          delete _tweenStates[name];
          continue;
        }
        var t = _tweenStates[name];
        var elapsed = now - t.start;
        if (elapsed >= t.duration) {
          applyParam(name, t.to);
          delete _tweenStates[name];
        } else {
          var progress = elapsed / t.duration;
          var eased = easeInOutQuad(progress);
          applyParam(name, t.from + (t.to - t.from) * eased);
        }
      }
    }

    // ============ 鼠标跟随引擎（每帧指数平滑，独立于 tween）============
    // Python 只发目标值，JS 每帧用 1-exp(-dt/tau) 逼近，不重启 → 丝滑且 FPS 无关。
    // 分层时间常数：眼球最快（几乎实时）、头颈稍慢、身体最慢（有重量感）。
    var _trackTargets = {};
    var _trackActive = false;
    var _trackLastTime = 0;

    var TRACK_TAU = {
      ParamEyeBallX: 55, ParamEyeBallY: 55,
      ParamAngleX: 110, ParamAngleY: 110, ParamAngleZ: 140,
      ParamBodyAngleX: 200, ParamBodyAngleY: 200, ParamBodyAngleZ: 220
    };

    function setTrackTarget(params) {
      _trackTargets = {};
      for (var name in (params || {})) _trackTargets[name] = params[name];
      _trackActive = Object.keys(_trackTargets).length > 0;
      if (_trackActive) _trackLastTime = 0;  // 重置时间
    }

    function _trackTick(now) {
      if (!_trackActive) return;
      var dt = _trackLastTime ? Math.min(100, now - _trackLastTime) : 16;
      _trackLastTime = now;
      var remaining = 0;
      for (var name in _trackTargets) {
        // 流式动画运行时跳过被流式控制的参数

        var tau = TRACK_TAU[name] || 90;
        var alpha = 1 - Math.exp(-dt / tau);
        var cur = getParamValue(name);
        var tgt = _trackTargets[name];
        var next = cur + (tgt - cur) * alpha;
        // 复位中且接近零 → 直接归零并清除
        if (tgt === 0 && Math.abs(next) < 0.01) {
          applyParam(name, 0);
          delete _trackTargets[name];
        } else {

      count: 0,
      paramCount: 0,
      intervalMs: 500,
      playing: false,
      repeat: 0,            // -1=无限循环, 0=播一遍, N=播N遍
      startTime: 0,
      kind: '',             // 'stream'=智能体流式动画 / 'builtin'=内置动画预设

      getValue: function (frameIdx, paramIdx) {
        return this.values[frameIdx * this.paramCount + paramIdx];
      },

      appendRows: function (rows) {
        var newCount = this.count + rows.length;
        if (newCount > this.capacity) this._grow(newCount);
        for (var i = 0; i < rows.length; i++) {
          var src = rows[i];
          var base = (this.count + i) * this.paramCount;
          for (var j = 0; j < this.paramCount; j++) {

          }

      },

        var newCap = Math.max(needed * 2, 64);

      var exactIndex = elapsed / _stream.intervalMs;

      // repeat 循环/停止判定
      if (_stream.repeat === -1) {
        exactIndex = exactIndex % totalFrames;
      } else {
        var totalPlayable = totalFrames * Math.max(1, _stream.repeat);
        if (exactIndex >= totalPlayable) {
          _stream.playing = false;
          return;

        exactIndex = exactIndex % totalFrames;

      var idx0 = Math.floor(exactIndex);
      var idx1 = (idx0 + 1) % totalFrames;

        var v1 = _stream.getValue(idx1, j);

      _stream.paramCount = data.params.length;
      _stream.intervalMs = intervalMs;
      _stream.repeat = repeat;
      _stream.count = 0;
      _stream.capacity = 0;
      _stream.values = new Float64Array(0);
      _stream.kind = kind || 'stream';

    // 找控制**嘴巴开合**的参数。form 是形状（圆扁/微笑），不是开合，不探测也不写入。
    // 分层优先级：
    //   1) 精确命中 ParamMouthOpenY / PARAM_MOUTH_OPEN_Y / sdParamMouthOpenY（碧蓝航线 225+/225 模型用）
    //   2) norm 含 mouthopen 子串（排除 mouthform），且排除一堆 shape 词：
    //      form/puker/display/size/type/smile/change/up/alpha/key/x/y（纯 form 会被排除）
    //   3) 宽松：含 mouth 或 lip + 含 open（且不含上述形状词）
    //   每一层里多候选时，选最干净的（无独立数字 token）。
    function _resolveMouthParamIds() {
      _mouthParamIds.open = '';
      try {
        var core = model && model.internalModel && model.internalModel.coreModel;
        var p = core && core._model && core._model.parameters;
        var ids = p && p.ids;
        if (!ids || !ids.length) {
          console.log('[mouthLock] 参数表为空，无法自动探测嘴型参数');
          return;
        }

        // —— 辅助 ——
        function normOf(raw) { return raw.toLowerCase().replace(/[^a-z0-9]/g, ''); }
        function hasDigitToken(raw) {
          for (var ti = 0; ti < raw.length; ti++) {
            var ch = raw[ti];
            if (ch >= '0' && ch <= '9') return true;
          }
          return false;
        }
        function pickCleanest(cands) {
          if (!cands.length) return '';
          for (var ci = 0; ci < cands.length; ci++) {
            if (!hasDigitToken(cands[ci])) return cands[ci];
          }

        var SHAPE_BAN = ['form', 'puker', 'display', 'size', 'type',
                         'smile', 'bianxing', 'change', 'qipao',
                         'alpha', 'key', 'autopen', 'up', 'down',
                         'angle', 'mode', 'collection'];

        // —— 第 1 层：精确命中清单（碧蓝航线主力）——

          'ParamMouthOpenY',
          'PARAM_MOUTH_OPEN_Y',
          'sdParamMouthOpenY',
          'ParamMouthOpenSD',
          'ParamMouthOpenYSD',
          'ParamMouthOpenY_SD',
          'ParamMouthOpen',
          'MouthOpenY',
          'MouthOpen',
          'MouthOpenAuto',
          'ParamELMouthOpen',
          'ParamELMouthAutoOpen',
          'ParamYZMouthOpen',
          'ParamSlysMouthOpen',
          'ParamCatMouthOpen',
          'ParamBMouthOpen',
          'ParamMao2MouthOpen',
          'ParamMao1IdleMouthOpen',
        ];
        for (var li = 0; li < EXACT_OPEN.length; li++) {
          for (var ii = 0; ii < ids.length; ii++) {
            if (String(ids[ii]) === EXACT_OPEN[li]) {
              _mouthParamIds.open = EXACT_OPEN[li];
              break;
            }
          }
          if (_mouthParamIds.open) break;
        }

        if (!_mouthParamIds.open) {
          var cand2 = [];
          for (var i = 0; i < ids.length; i++) {
            var raw = String(ids[i] || '');
            var n = normOf(raw);
            if (n.indexOf('mouthopen') < 0) continue;
            if (n.indexOf('mouthform') >= 0) continue;  // mouthform 子串会误命中
            var banned = false;
            for (var bi = 0; bi < SHAPE_BAN.length; bi++) {
              if (n.indexOf(SHAPE_BAN[bi]) >= 0) { banned = true; break; }
            }
            if (!banned) cand2.push(raw);
          }
          _mouthParamIds.open = pickCleanest(cand2);
        }

        if (!_mouthParamIds.open) {

          for (var j = 0; j < ids.length; j++) {
            var raw2 = String(ids[j] || '');
            var n2 = normOf(raw2);
            var hasMouth = n2.indexOf('mouth') >= 0 || n2.indexOf('lip') >= 0;
            var hasOpen  = n2.indexOf('open') >= 0;
            if (!(hasMouth && hasOpen)) continue;
            var banned2 = false;
            for (var bj = 0; bj < SHAPE_BAN.length; bj++) {

    function _installMouthLock(m) {

        case 'setPosition':
          // 全屏架构由 setLayout 决定模型位置；旧命令只重算一次，不再居中到整屏。
          applyFit();
          break;

        case 'setScale':
          // 缩放由 Python 改 Stage 尺寸后下发 setLayout
          break;

        // —— 帧推送 ——
        case 'setFrameEndpoint':

          break;

        case 'setPush':
          setPush(cmd.on);
          break;

        // —— 捏脸参数 ——
        case 'setParams':
          if (cmd.params) {

            var _r3 = function (v) {

        case 'getParamValues':

            var has = {};
            var idxs = {};
            var names = cmd.names || ['ParamMouthOpenY'];
            for (var k = 0; k < names.length; k++) {
              try {
                var vv = c.getParameterValueById(names[k]);
                out[names[k]] = Math.round(vv * 1000) / 1000;
                // getParameterValueById 对不存在的参数也返回默认值 1，
                // 光看数值判断不了"有没有"，必须查索引（换模型的适配验收靠它）
                var ix = paramIndex(names[k]);
                has[names[k]] = (ix >= 0);
                idxs[names[k]] = ix;
              } catch (e) { out[names[k]] = null; has[names[k]] = false; idxs[names[k]] = 'err'; }

        case 'getAssets':

        case 'dumpFrame':

        case 'getDebugInfo':
          // 诊断：Core 版本 / 画布 / 模型 / drawable 顶点与 UV 是否健康

            iw: window.innerWidth, ih: window.innerHeight,
            tw: targetW, th: targetH,
            busy: _switchBusy, ready: _modelReady, err: _lastSwitchError || '',
            modelUrl: _modelJsonUrl,
            vw: 0, vh: 0, rw: 0, rh: 0, res: 0, dbw: 0, dbh: 0,
            stage: -1, mw: 0, mh: 0, sx: 0, mx: 0, my: 0,
            baseW: modelBaseW, baseH: modelBaseH,
            iw2: 0, ih2: 0, draws: -1, nanVerts: -1, uvBad: -1, tex: []
          };
          try {
            if (window.Live2DCubismCore && Live2DCubismCore.Version && Live2DCubismCore.Version.csmGetVersion) {
              _info.core = Live2DCubismCore.Version.csmGetVersion();
            }
          } catch (e) { }
          try {
            if (app && app.renderer) {
              _info.vw = app.view.width; _info.vh = app.view.height;
              _info.rw = app.renderer.width; _info.rh = app.renderer.height;
              _info.res = app.renderer.resolution;
              if (app.renderer.gl) {
                _info.dbw = app.renderer.gl.drawingBufferWidth;
                _info.dbh = app.renderer.gl.drawingBufferHeight;
              }
            }
            if (app && app.stage) _info.stage = app.stage.children.length;
          } catch (e) { }
          try {
            if (model) {
              _info.mw = model.width; _info.mh = model.height;
              _info.sx = model.scale.x; _info.mx = model.x; _info.my = model.y;
              if (model.internalModel) {
                _info.iw2 = model.internalModel.width;
                _info.ih2 = model.internalModel.height;

              if (model.textures) {

              var _nan = 0, _uvBad = 0;

          try {

            return JSON.stringify(res);
          } catch (e) {
            return JSON.stringify({ error: String(e) });
          }
        }

        case 'hitTestParts':
          return JSON.stringify(_hitTestParts(cmd.nx, cmd.ny));

        case 'getClickMap':
          return JSON.stringify(_clickMap(cmd.cols, cmd.rows, cmd.cells));

        case 'partBoxes':
          return JSON.stringify(_partBoxes(cmd.match || '', !!cmd.detail));

        case 'alphaAt':
          return JSON.stringify(_alphaAt(cmd.points || []));

        case 'hitBoxes':
          return JSON.stringify(_hitBoxes(cmd.ids || []));

        case 'hidePart':
          return JSON.stringify(_hidePart(cmd.partId, cmd.partIndex));

        case 'showAllParts':
          return JSON.stringify(_showAllParts());

        case 'hideDrawable':
          return JSON.stringify(_hideDrawable(cmd.drawableIndex));
        case 'getDrawables':
          return JSON.stringify(_drawablesInfo());
        case 'getDrawableMeta':
          return JSON.stringify(_drawableMeta());
        case 'autoHideBackground':

          return JSON.stringify(_showAllDrawables());

        case 'clearHighlight':

          return JSON.stringify({ ok: true });

        case 'playMotion':
          return JSON.stringify(handlePlayMotion(cmd));

        case 'getAudioState':
          return JSON.stringify(_audioState());

        case 'setSound':
          var _sc = _soundConfig();
          if (_sc) _sc.sound = !!cmd.on;
          return JSON.stringify({ ok: true, sound: _sc ? !!_sc.sound : null });

        case 'stopMotion':
          return JSON.stringify(handleStopMotion(cmd));

        case 'setExpression':
          return JSON.stringify(handleSetExpression(cmd));

        // —— 换装：写入服装参数并锁定（每帧强压，动作/表情改不回去）——
        case 'applyOutfit':
          if (cmd.clear) _clearOutfitLock();
          var _opar = cmd.params || {};
          for (var _oid in _opar) {

          for (var _olk in _outfitLock) _olist.push(_olk);

        case 'invalidateHitFrame':

        case 'startStream':

          break;

        case 'appendFrames':
          handleAppendFrames(cmd);
          break;

        case 'stopStream':
          handleStopStream();
          break;

        case 'setTrackTarget':
          setTrackTarget(cmd.params || {});
          break;

        case 'syncCanvas':
          if (cmd.w && cmd.h) syncCanvas(cmd.w, cmd.h);
          break;

        case 'getModelRect':
          // 返回模型在画布（= PetWidget 窗口 1:1）内的可见矩形
          if (model && model.width && model.height) {
            return JSON.stringify({
              x: Math.round(model.x - model.width / 2),
              y: Math.round(model.y - model.height / 2),
              w: Math.round(model.width),
              h: Math.round(model.height),
              cw: Math.round(_directMode ? window.innerWidth : app.view.width),
              ch: Math.round(_directMode ? window.innerHeight : app.view.height),

            });
          }

        case 'getAlphaMask':
          return JSON.stringify(_alphaMask(cmd.cols, cmd.rows));

        // —— 模型切换（就地替换，不重载页面）——
        case 'switchModel':
          if (cmd.modelUrl && window.PIXI && PIXI.live2d) {
            // 每次切换分配序号：并发/连点切换时只保留最后一次，过期结果直接销毁丢弃
            var seq = ++_switchSeq;

            _switchBusy = true;
            _modelReady = false;
            _lastSwitchError = "";

              _switchBusy = false;
              _modelReady = false;

            _trackLastTime = 0;

            disposeCurrentModel();
            try {

              _diagnoseConfig(modelUrl, app);

                .then(function (nm) {

                    try { nm.destroy({ children: true }); } catch (e) { }
                    _releaseTextures(staleUrls);

                  }
                  try { nm.autoInteract = false; } catch (e) { }

                  _modelJsonUrl = modelUrl;
                  model.anchor.set(0.5, 0.5);
                  model.scale.set(1);

                  modelBaseW = base[0];
                  modelBaseH = base[1];
                  applyFit();
                  _cropReset();
                  // 保留模型自带背景：不再自动隐藏底层大面积部件。
                  // 透明窗现在按模型包围盒裁剪，背景只会在模型窗口内出现，不会铺满全屏。
                  _partNames();          // 顺手把部件名（cdi3）先拉一次，双击判定用
                  _partNamesAsync();
                  app.stage.addChild(model);
                  try { _swayInit(); } catch (e) { }
                  // 停止内置待机动作 + 禁止自动重播（否则会覆盖捏脸/跟随参数）
                  try { model.internalModel.motionManager.stopAllMotions(); } catch (e) { }

                  _switchBusy = false;

                  _loadRetry = 0;
                  _lastSwitchError = '';

                  _modelReady = false;
                  _lastSwitchError = String(err && err.message ? err.message : err);
                  model = null;
                  modelBaseW = 0;
                  modelBaseH = 0;
                  if (_retryLoad(modelUrl)) return;   // 先自动重建重试，别急着报错

                  }
                });

              _switchBusy = false;
              _modelReady = false;
              _lastSwitchError = String(e && e.message ? e.message : e);
              model = null;
              modelBaseW = 0;
              modelBaseH = 0;
              if (_retryLoad(modelUrl)) return;
              if (window.bridge && window.bridge.notifyModelError) {
                try { window.bridge.notifyModelError(_lastSwitchError); } catch (e2) { }
              }

    };

    // ============ 选中部件轮廓高亮 ============
    function _ensureHighlightGfx() {
      if (!app || !app.stage) return null;
      if (!_highlightGfx) {
        try { _highlightGfx = new PIXI.Graphics(); } catch (e) { _highlightGfx = null; return null; }
      }
      if (!_highlightGfx.parent) {
        try { app.stage.addChild(_highlightGfx); } catch (e) { }
      }
      return _highlightGfx;
    }

    function _clearHighlight() {
      _highlight.active = false;
      _highlight.partIndex = -1;
      _highlight.drawableIndex = -1;
      var g = _highlightGfx;
      _highlightGfx = null;
      if (g) {
        try {
          g.clear();
          if (g.parent) g.parent.removeChild(g);
        } catch (e) { }
        try { g.destroy(); } catch (e) { }
      }
    }

    function _setHighlight(partIndex, drawableIndex) {
      _highlight.active = true;
      _highlight.partIndex = (typeof partIndex === 'number' ? partIndex : -1);
      _highlight.drawableIndex = (typeof drawableIndex === 'number' ? drawableIndex : -1);
    }

    function _updateHighlight() {
      if (!_highlight.active || !model || !model.internalModel) return;
      var gfx = _ensureHighlightGfx();
      if (!gfx) return;
      var core = model.internalModel.coreModel;
      // 跟随模型当前世界变换（位置/缩放/动画）
      try {
        if (gfx.transform && gfx.transform.setFromMatrix) {
          gfx.transform.setFromMatrix(model.worldTransform);
        } else {
          gfx.position.copyFrom(model.position);
          gfx.scale.copyFrom(model.scale);
          gfx.pivot.copyFrom(model.pivot);
          gfx.rotation = model.rotation;
          if (gfx.skew && model.skew) gfx.skew.copyFrom(model.skew);
        }
      } catch (e) { }
      var vsx = 1, vsy = 1;
      try {
        if (model.internalModel.originalWidth > 0 && modelBaseW > 0) vsx = modelBaseW / model.internalModel.originalWidth;
        if (model.internalModel.originalHeight > 0 && modelBaseH > 0) vsy = modelBaseH / model.internalModel.originalHeight;
      } catch (e) { }
      // 线宽按模型缩放补偿，保证屏幕上约 2px
      var lw = 2.0 / Math.max(0.02, Math.abs(model.scale.x || 1) * vsx);
      gfx.clear();
      gfx.lineStyle(lw, 0x4da3ff, 0.95);
      gfx.beginFill(0x4da3ff, 0.16);

      var n = core.getDrawableCount();
      var picked = _highlight.drawableIndex;
      if (picked < 0 || picked >= n) { gfx.endFill(); return; }
      var drawn = 0, budget = 8000;
      for (var i = 0; i < n; i++) {
        if (i !== picked) continue;
        var v = null, idx = null;
        try { v = model.internalModel.getDrawableVertices(i); } catch (e) { continue; }
        try { idx = core.getDrawableVertexIndices(i); } catch (e) { idx = null; }
        if (!v || !v.length || !idx || !idx.length) continue;
        var triCount = Math.floor(idx.length / 3);
        if (triCount <= 0) continue;
        if (drawn + triCount > budget && i !== picked) continue;
        for (var t = 0; t < triCount; t++) {
          var a = idx[t * 3] * 2, b = idx[t * 3 + 1] * 2, c = idx[t * 3 + 2] * 2;
          if (a + 1 >= v.length || b + 1 >= v.length || c + 1 >= v.length) continue;
          var ax = v[a] * vsx, ay = v[a + 1] * vsy;
          var bx = v[b] * vsx, by = v[b + 1] * vsy;
          var cx = v[c] * vsx, cy = v[c + 1] * vsy;
          if (!isFinite(ax) || !isFinite(ay) || !isFinite(bx) || !isFinite(by) ||
              !isFinite(cx) || !isFinite(cy)) continue;
          gfx.moveTo(ax, ay);
          gfx.lineTo(bx, by);
          gfx.lineTo(cx, cy);
          gfx.closePath();
        }
        drawn += triCount;
      }
      gfx.endFill();

      if (!drawn && picked >= 0) {
        // 兜底：拿不到索引时按 bbox 画外框
        var pv = null;
        try { pv = model.internalModel.getDrawableVertices(picked); } catch (e) { }
        if (pv && pv.length) {
          var bx0 = 1e9, by0 = 1e9, bx1 = -1e9, by1 = -1e9;
          for (var k = 0; k < pv.length; k += 2) {
            var qx = pv[k] * vsx, qy = pv[k + 1] * vsy;
            if (!isFinite(qx) || !isFinite(qy)) continue;
            if (qx < bx0) bx0 = qx;
            if (qx > bx1) bx1 = qx;
            if (qy < by0) by0 = qy;
            if (qy > by1) by1 = qy;
          }
          if (bx1 > bx0 && by1 > by0) {
            gfx.lineStyle(lw, 0x4da3ff, 0.95);
            gfx.beginFill(0x4da3ff, 0.10);
            gfx.drawRect(bx0, by0, bx1 - bx0, by1 - by0);
            gfx.endFill();
          }
        }
      }
    }

    // ============ 按单个网格（drawable）隐藏 ============
    // Cubism 没有 drawable 级透明度接口，隐藏时把该网格所有顶点折叠到一个点
    // （零面积三角形不绘制）。顶点每帧会被模型 update 重算，所以必须在
    // internalModel.draw 之前清零 —— 用绘制钩子保证时序。
    function _applyHiddenDrawables() {
      if (!_hiddenDrawables.length) return;
      var core = model && model.internalModel && model.internalModel.coreModel;
      if (!core) return;
      var raw = null;
      try { raw = core._model.drawables; } catch (e) { raw = null; }
      if (!raw || !raw.vertexPositions) return;
      for (var h = 0; h < _hiddenDrawables.length; h++) {
        var pos = raw.vertexPositions[_hiddenDrawables[h]];
        if (!pos) continue;

        var op = 1;
        try { op = core.getPartOpacityByIndex(pidx); } catch (e) { }
        var one = {
          partIndex: pidx, partId: pid, partName: nm, drawables: bb.n,
          nx0: bb.x0, ny0: bb.y0, nx1: bb.x1, ny1: bb.y1,
          opac: op
        };
        if (detail) one.items = perDraw[pidx] || [];
        out.push(one);
      }
      out.sort(function (a, b) { return a.ny0 - b.ny0; });
      return { ok: true, iw: iw, ih: ih, scrW: scrW, scrH: scrH, parts: out, count: out.length };
    }

    // model3.json 的 HitAreas.Id 指向的多是 **ArtMesh（drawable）Id**（Cubism 的命中区
    // 本来就是画出来的网格），少部分模型写的是 Part Id。这里两种都认：
    // 精确 → 忽略大小写 → 包含匹配，逐个换算成屏幕归一化矩形交给 Python 布点。
    function _idMatch(arr, id) {
      if (!arr || !id) return -1;
      var i, n = arr.length, lo = String(id).toLowerCase();
      for (i = 0; i < n; i++) if (String(arr[i]) === id) return i;
      for (i = 0; i < n; i++) if (String(arr[i]).toLowerCase() === lo) return i;
      for (i = 0; i < n; i++) {
        var s = String(arr[i]).toLowerCase();
        if (s && (s.indexOf(lo) >= 0 || lo.indexOf(s) >= 0)) return i;
      }
      return -1;
    }

    function _hitBoxes(ids) {
      if (!model || !model.internalModel) return { ok: false, error: 'model not loaded' };
      var core = model.internalModel.coreModel;
      var iw = modelBaseW || model.internalModel.width;
      var ih = modelBaseH || model.internalModel.height;
      var vsx = 1, vsy = 1;
      try {
        if (model.internalModel.originalWidth > 0 && iw > 0) vsx = iw / model.internalModel.originalWidth;
        if (model.internalModel.originalHeight > 0 && ih > 0) vsy = ih / model.internalModel.originalHeight;
      } catch (e) { }
      var scrW = app.renderer.screen.width, scrH = app.renderer.screen.height;
      var nDraw = core.getDrawableCount();
      var dIds = null;
      try { dIds = core._drawableIds || null; } catch (e) { dIds = null; }
      if (!dIds) {
        try { dIds = core._model.drawables.ids || null; } catch (e) { dIds = null; }
      }
      var pIds = null;
      try { pIds = core._partIds || null; } catch (e) { pIds = null; }
      if (!pIds) {
        try { pIds = core._model.parts.ids || null; } catch (e) { pIds = null; }
      }
      var names = _partNames();
      _partNamesAsync();
      var parentPart = null;
      try { parentPart = core._model.drawables.parentPartIndices; } catch (e) { parentPart = null; }
      var db = new Array(nDraw);        // 每个 drawable 自己的屏幕包围盒
      var pb = {};                      // 每个 Part 汇总的包围盒
      for (var i = 0; i < nDraw; i++) {
        var v = null;
        try { v = model.internalModel.getDrawableVertices(i); } catch (e) { continue; }
        if (!v || v.length < 2) continue;
        var d = { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9, n: 0 };
        for (var k = 0; k < v.length; k += 2) {
          var vx = v[k] * vsx, vy = v[k + 1] * vsy;
          if (!isFinite(vx) || !isFinite(vy)) continue;
          var g = model.toGlobal(new PIXI.Point(vx, vy));
          var sx = g.x / scrW, sy = g.y / scrH;
          if (!isFinite(sx) || !isFinite(sy)) continue;
          if (sx < d.x0) d.x0 = sx;
          if (sx > d.x1) d.x1 = sx;
          if (sy < d.y0) d.y0 = sy;
          if (sy > d.y1) d.y1 = sy;
          d.n++;
        }
        if (!d.n) continue;
        db[i] = d;
        var pi = parentPart ? parentPart[i] : -1;
        var b = pb[pi] || (pb[pi] = { x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9, n: 0 });
        if (d.x0 < b.x0) b.x0 = d.x0;
        if (d.y0 < b.y0) b.y0 = d.y0;
        if (d.x1 > b.x1) b.x1 = d.x1;
        if (d.y1 > b.y1) b.y1 = d.y1;
        b.n++;
      }
      var regs = [], miss = [];
      for (var q = 0; q < (ids || []).length; q++) {
        var spec = ids[q];
        var hid = String((spec && spec.id) || spec || '');
        var nm = String((spec && spec.name) || '');
        if (!hid) continue;
        var di = _idMatch(dIds, hid), box = null, kind = '';
        if (di >= 0 && db[di]) { box = db[di]; kind = 'drawable'; }
        if (!box) {
          var pj = _idMatch(pIds, hid);
          if (pj < 0 && nm) pj = _idMatch(names, nm);
          if (pj >= 0 && pb[pj]) { box = pb[pj]; kind = 'part'; }
        }
        if (!box) { miss.push(hid); continue; }
        var vis = -1, opac = -1;
        if (kind === 'drawable') {
          try { vis = core.getDrawableDynamicFlagIsVisible(di) ? 1 : 0; } catch (e) { }
          try { opac = core.getDrawableOpacity(di); } catch (e) { }
        }
        regs.push({
          id: hid, name: nm, kind: kind,
          nx0: box.x0, ny0: box.y0, nx1: box.x1, ny1: box.y1,
          // 区中心（归一化）：网格在该区里一格都没捞到时，用它兜底，
          // 保证作者画定的交互区至少有一个可用触发点。
          cx: (box.x0 + box.x1) * 0.5, cy: (box.y0 + box.y1) * 0.5,
          drawables: box.n, vis: vis, opac: opac
        });
      }
      return { ok: true, iw: iw, ih: ih, scrW: scrW, scrH: scrH, regions: regs, misses: miss };
    }


    // ============ 双击热区地图 ============

    // 画面归一化的 Stage 范围（模型真正被画在里面的那块区域）。
    // 全屏可见时画布是整块显示器，布景/特效可能一直铺到屏幕边缘；
    // 只在这块区域里取格子，热区才不会跑到模型之外的空白处。
    function _stageBand() {
      var w = window.innerWidth || 1, h = window.innerHeight || 1;
      var st = _layoutStageLocal();
      return {
        x0: Math.max(-0.02, st.x / w),
        y0: Math.max(-0.02, st.y / h),
        x1: Math.min(1.02, (st.x + st.w) / w),
        y1: Math.min(1.02, (st.y + st.h) / h)
      };
    }

    function _inBand(nx, ny, band) {
      return nx >= band.x0 && nx <= band.x1 && ny >= band.y0 && ny <= band.y1;
    }

    // 鼠标命中区用的范围 = Stage ∪ 模型自身可见包围盒。
    //
    // Stage 只是「布局盒」：直出模式 applyFit 只按高度贴合模型，宽度取的是
    // Stage 宽度，模型比 Stage 宽时就会有一段美术落在 Stage 之外。那段像素
    // 照样画在屏幕上，命中区却按 Stage 裁掉 → 用户看到的就是
    // 「明明不是透明的，鼠标却穿透到下面的窗口」。
    //
    // 所以取 alpha 剪影 / 单点可见性时用这个更宽的范围；热区网格仍用
    // _stageBand（热区要贴在角色身上，不能铺到画布外的空白处）。
    // 保险：模型包围盒远大于 Stage 时（布景/特效铺满整屏）不扩，
    // 否则整块桌面都会变成可点区域，邻居窗口/桌面点不动。
    function _hitBand() {
      var band = _stageBand();
      try {
        if (!model) return band;
        var w = window.innerWidth || 1, h = window.innerHeight || 1;
        var cw = w, ch = h;
        var cs = _canvasSize();
        if (cs && cs[0] > 0 && cs[1] > 0) { cw = cs[0]; ch = cs[1]; }
        var b = model.getBounds();            // 画布坐标（左上原点）
        var mx0 = Math.max(0, b.x / cw), my0 = Math.max(0, b.y / ch);
        var mx1 = Math.min(1, (b.x + b.width) / cw), my1 = Math.min(1, (b.y + b.height) / ch);
        if (mx1 <= mx0 || my1 <= my0) return band;
        var sw = Math.max(1e-4, band.x1 - band.x0);
        var sh = Math.max(1e-4, band.y1 - band.y0);
        if ((mx1 - mx0) * (my1 - my0) <= sw * sh * 2.5 + 0.02) {
          return {
            x0: Math.max(0, Math.min(band.x0, mx0)),
            y0: Math.max(0, Math.min(band.y0, my0)),
            x1: Math.min(1, Math.max(band.x1, mx1)),
            y1: Math.min(1, Math.max(band.y1, my1))
          };
        }
      } catch (e) { }
      return band;
    }

    // 只保留"前排"格子：模型自带的布景/底座（渲染层级垫底的大片美术）在 alpha
    // 上同样不透明，最远点采样会把热区甩到这些背景上 —— 用户看到的就是
    // "热区铺到空白处、没落在模型身上"。按每格最上层 drawable 的 renderOrder
    // 取中位数以上的格子；筛得太狠就逐步放宽，保证每个动画仍有可选点。
    function _frontCells(cells) {
      if (!cells || cells.length < 12) return cells || [];
      var orders = [];
      for (var i = 0; i < cells.length; i++) {
        var o = cells[i].o;
        if (typeof o === 'number' && o >= 0) orders.push(o);
      }
      if (orders.length < cells.length * 0.6) return cells;   // 层级拿不到就不筛
      orders.sort(function (a, b) { return a - b; });
      var levels = [
        orders[Math.floor(orders.length * 0.5)],
        orders[Math.floor(orders.length * 0.25)]
      ];
      for (var li = 0; li < levels.length; li++) {
        var lv = levels[li];
        var kept = [];
        for (var k = 0; k < cells.length; k++) {
          var oc = cells[k].o;
          if (typeof oc !== 'number' || oc < 0 || oc >= lv) kept.push(cells[k]);
        }
        if (kept.length >= Math.max(8, Math.ceil(cells.length * 0.25))) return kept;
      }
      return cells;
    }

    // 把"模型可见区域"切成网格，返回每格的中心坐标、不透明度、最上层部件名。
    // Python 侧据此给**每个动画**分配一个互不重合的触发点（语义明确的按名字归位，
    // 语义不清的用最远点采样铺开）。网格只取模型身上的格子，点下去必定命中模型。
    // 双击热区网格：**按 Stage 实际占的屏幕面积**自适应切格，而不是对整块画布
    // 固定切 18×26。local 模式下 Stage 只有 210×240，而画布是整屏 1920×1080，
    // 固定 18 列 → 每格 107px，模型只压得住 1~2 列，所有热区就塌成一条竖带
    // （用户看到的就是"热区停在屏幕固定区域、不在部件上"）。
    function _clickMap(cols, rows, targetCells) {
      if (!model || !model.internalModel) return { ok: false, error: 'model not loaded' };
      var wh = _canvasSize();
      var cw = wh[0], ch = wh[1];
      if (!cw || !ch) return { ok: false, error: 'no canvas' };
      // 每次都抓一帧新的：Stage 缩放/移动后旧缓冲的裁剪偏移已经过期，
      // 拿旧帧取 alpha 会大量误判成透明（热区于是只剩零星几格可用）。
      if (!_captureClickFrame()) {
        if (!_pixBuf || !_pixW || !_pixH) return { ok: false, error: 'no frame buffer yet' };
      }
      var pw = _pixW, ph = _pixH;
      var ox = _crop.valid ? _crop.x : 0, oy = _crop.valid ? _crop.y : 0;
      var band0 = _stageBand();
      // 目标格数（默认 900）：格子边长 = sqrt(Stage 面积 / 格数)，
      // 小 Stage 自然更细，大 Stage 自然更粗，格数总量不变 → 耗时可控。
      var tgt = Math.max(120, Math.min(2400, parseInt(targetCells, 10) || 900));
      var bwN = Math.max(0.01, band0.x1 - band0.x0), bhN = Math.max(0.01, band0.y1 - band0.y0);
      var bpx = bwN * cw, bpy = bhN * ch;
      var cell = Math.max(5, Math.sqrt((bpx * bpy) / tgt));
      cols = Math.round(bpx / cell);
      rows = Math.round(bpy / cell);
      cols = Math.max(4, Math.min(120, cols));
      rows = Math.max(4, Math.min(120, rows));
      var iw = modelBaseW || model.internalModel.width;
      var ih = modelBaseH || model.internalModel.height;
      var vsx = 1, vsy = 1;
      try {
        if (model.internalModel.originalWidth > 0 && iw > 0) vsx = iw / model.internalModel.originalWidth;
        if (model.internalModel.originalHeight > 0 && ih > 0) vsy = ih / model.internalModel.originalHeight;
      } catch (e) { }
      var cand = _hitCandidates();
      var coreModel = model.internalModel.coreModel;
      var names = _partNames();
      var scrW = app.renderer.screen.width, scrH = app.renderer.screen.height;
      var t0 = (window.performance && performance.now) ? performance.now() : Date.now();
      var band = _stageBand();
      var cells = [];
      for (var r = 0; r < rows; r++) {
        for (var c = 0; c < cols; c++) {
          // 网格铺在 Stage 范围内（band 相对），而不是整块画布
          var nx = band.x0 + (c + 0.5) * bwN / cols;
          var ny = band.y0 + (r + 0.5) * bhN / rows;
          // ⓪ 只在 Stage 范围内取格：全屏可见时布景会铺到屏幕边缘，
          // 不先圈定 Stage 的话热区会落进模型之外的空白画面。
          if (!_inBand(nx, ny, band)) continue;
          // ① 不透明度：canvas 坐标 → 裁剪缓冲坐标（缓冲是自下而上的）
          var cx = Math.floor(nx * cw) - ox;
          var ctop = Math.floor(ny * ch) - oy;
          if (cx < 2 || ctop < 2 || cx >= pw - 2 || ctop >= ph - 2) continue;
          var by = ph - 1 - ctop;
          // 取 7×7 五点采样的**最小值**：只有整片都实心的格子才算"实心格"。
          // 用最大值会把发丝、轮廓边缘的格子也算进来 —— 那种格子模型一动就变透明，
          // 双击热区会"点不动"（曾经 6 个点里有 1 个踩在头顶发梢上就是这样失效的）。
          var a = 255;
          for (var dy = -3; dy <= 3; dy += 3) {
            for (var dx = -3; dx <= 3; dx += 3) {
              var px2 = cx + dx, py2 = by + dy;
              var av = 0;
              if (px2 >= 0 && py2 >= 0 && px2 < pw && py2 < ph) {
                av = _pixBuf[(py2 * pw + px2) * 4 + 3];
              }
              if (av < a) a = av;
            }
          }
          if (a < 40) continue;            // 透明 / 半透明边缘格：模型之外或不可靠
          // ② 部位名：世界坐标下取"最上层命中"的那张网格
          var local = model.toLocal(new PIXI.Point(nx * scrW, ny * scrH));
          var hit = _hitDrawables(local.x, local.y, cand, vsx, vsy, true);
          if (!hit.length) hit = _hitDrawables(local.x, ih - local.y, cand, vsx, vsy, true);
          var pname = '';
          var order = -1;
          if (hit.length) {
            var info = _partInfoOfDrawable(hit[0]);
            if (info) pname = names[info.partId] || '';
            try { order = coreModel._model.drawables.renderOrders[hit[0]]; } catch (e) { order = -1; }
          }
          cells.push({ x: nx, y: ny, a: a, p: pname, o: order });
        }
      }
      var ms = ((window.performance && performance.now) ? performance.now() : Date.now()) - t0;
      var raw = cells.length;
      cells = _frontCells(cells);
      return {
        ok: true, cw: cw, ch: ch, cols: cols, rows: rows, cells: cells,
        cells_raw: raw, band: [band0.x0, band0.y0, band0.x1, band0.y1],
        cell_px: Math.round(cell * 100) / 100,
        // 这批格子是按**这一刻**的 Stage 量出来的。Python 侧必须用这个值做
        // 坐标换算的基准：它要是事后再去读一次 stage_rect()，快速拖动中途
        // 回包已经晚了十几像素，算出来的命中区就会整块偏移 —— 松手后模型
        // 看得见却点不到、右键也落到桌面。
        stage: _stageScreenRect(),
        ms: Math.round(ms), parts_known: Object.keys(names || {}).length
      };
    }

    // 把当前帧的 alpha 降采样成 0/1 网格，供 Qt 交互覆盖层做 setMask。
    // 只用于“模型外的空白恢复鼠标穿透”，不下发像素、不进入显示链路。
    function _alphaMask(cols, rows) {
      if (!_captureClickFrame()) return { ok: false, error: 'no frame buffer yet' };
      var wh = _canvasSize();
      var cw = wh[0], ch = wh[1];
      if (!cw || !ch) return { ok: false, error: 'no canvas' };
      cols = Math.max(16, Math.min(240, parseInt(cols, 10) || 96));
      rows = Math.max(16, Math.min(240, parseInt(rows, 10) || 100));
      var pw = _pixW, ph = _pixH;
      var ox = _crop.valid ? _crop.x : 0, oy = _crop.valid ? _crop.y : 0;
      var band = _hitBand();
      var bits = [];
      for (var r = 0; r < rows; r++) {
        var line = '';
        for (var c = 0; c < cols; c++) {
          // Stage 以外一律记 0：全屏可见时布景/特效可能铺满屏幕，
          // 不圈 Stage 会让整个桌面都变成"可点区域"。
          if (!_inBand((c + 0.5) / cols, (r + 0.5) / rows, band)) {
            line += '0';
            continue;
          }
          var hit = 0;
          // 每格采样 5 个点（中心 + 四角内缩），只要任意一点可见就算命中，
          // 避免把发梢、手指等细长实体误判成透明。
          for (var sy = 0; sy < 2 && !hit; sy++) {
            for (var sx = 0; sx < 2 && !hit; sx++) {
              var nx = (c + (sx ? 0.75 : 0.25)) / cols;
              var ny = (r + (sy ? 0.75 : 0.25)) / rows;
              var bx = Math.floor(nx * cw) - ox;
              var bt = Math.floor(ny * ch) - oy;
              if (bx < 0 || bt < 0 || bx >= pw || bt >= ph) continue;
              var alpha = _pixBuf[((ph - 1 - bt) * pw + bx) * 4 + 3];
              if (alpha >= 24) { hit = 1; break; }
            }
          }
          line += hit ? '1' : '0';
        }
        bits.push(line);
      }
      return { ok: true, cw: cw, ch: ch, cols: cols, rows: rows, bits: bits,
               // 同样回传"抓这一帧时的 Stage"：命中区换算的基准必须和帧一致
               stage: _stageScreenRect() };
    }

    // ============ 单点采样（自检） ============
    // 给一组归一化坐标，回每点的裁剪缓冲不透明度 + 最上层部件名。
    // 用来判断作者画的"触碰框"到底是实心美术，还是一张看不见的引导图。
    function _alphaAt(points) {
      if (!_pixBuf || !_pixW || !_pixH) return { ok: false, error: 'no frame buffer yet' };
      if (!model || !model.internalModel) return { ok: false, error: 'model not loaded' };
      var wh = _canvasSize();
      var cw = wh[0], ch = wh[1];
      var pw = _pixW, ph = _pixH;
      var ox = _crop.valid ? _crop.x : 0, oy = _crop.valid ? _crop.y : 0;
      var scrW = app.renderer.screen.width, scrH = app.renderer.screen.height;
      var iw = modelBaseW || model.internalModel.width;
      var ih = modelBaseH || model.internalModel.height;
      var vsx = 1, vsy = 1;
      try {
        if (model.internalModel.originalWidth > 0 && iw > 0) vsx = iw / model.internalModel.originalWidth;
        if (model.internalModel.originalHeight > 0 && ih > 0) vsy = ih / model.internalModel.originalHeight;
      } catch (e) { }
      var names = _partNames();
      var cand = _hitCandidates();
      var band = _hitBand();
      var out = [];
      for (var i = 0; i < (points || []).length; i++) {
        var pt = points[i] || {};
        var nx = pt.nx, ny = pt.ny;
        var cx = Math.floor(nx * cw) - ox;
        var ctop = Math.floor(ny * ch) - oy;
        var a = -1;
        // Stage 之外当作完全透明：双击/命中判定不该认那里的像素。
        if (_inBand(nx, ny, band) && cx >= 0 && ctop >= 0 && cx < pw && ctop < ph) {
          a = _pixBuf[((ph - 1 - ctop) * pw + cx) * 4 + 3];
        }
        var local = model.toLocal(new PIXI.Point(nx * scrW, ny * scrH));
        var hit = _hitDrawables(local.x, local.y, cand, vsx, vsy, true);
        if (!hit.length) hit = _hitDrawables(local.x, ih - local.y, cand, vsx, vsy, true);
        var pname = '';
        if (hit.length) {
          var info = _partInfoOfDrawable(hit[0]);
          if (info) pname = names[info.partId] || '';
        }
        out.push({ nx: nx, ny: ny, a: a, p: pname });
      }
      return { ok: true, cw: cw, ch: ch, points: out };
    }

    function _hidePart(partId, partIndex) {
      if (!model || !partId) return { ok: false, error: 'model not loaded' };
      var core = model.internalModel.coreModel;
      var id = String(partId);
      var idx = typeof partIndex === 'number' ? partIndex : -1;
      var exists = false;
      for (var i = 0; i < _hiddenParts.length; i++) {
        if (_hiddenParts[i].id === id) { exists = true; break; }
      }
      if (!exists) _hiddenParts.push({ id: id, index: idx });
      try { core.setPartOpacityById(id, 0); } catch (e) { }
      _applyHiddenParts();
      _clearHighlight();
      return { ok: true, hidden: _hiddenParts.length, partId: id };
    }

    function _showAllParts() {
      var core = model && model.internalModel && model.internalModel.coreModel;
      if (core) {
        for (var i = 0; i < _hiddenParts.length; i++) {
          try { core.setPartOpacityById(_hiddenParts[i].id, 1); } catch (e) { }
        }
      }
      var n = _hiddenParts.length + _hiddenDrawables.length;
      _hiddenParts = [];
      _hiddenDrawables = [];
      _applyHiddenParts();
      _clearHighlight();
      return { ok: true, restored: n };
    }

    // ============ 每帧驱动：参数引擎 + 动作循环 + 帧推送 ============
    // 原生 motion 由本页 app.ticker 驱动，不能依赖 PIXI.Ticker.shared。
    // 注意：不要使用 ticker 回调里的 dt 直接喂 internalModel —— 不同 PIXI 版本
    // 的单位不一致，会让呼吸/眨眼以 1/16 速度运行；这里统一用本机高精度时间差。
    var _nativeLastMs = 0;
    function _nativeMotionTick() {
      if (!model || !model.internalModel || model.autoUpdate) return;
      var now = performance.now();
      var dt = _nativeLastMs ? (now - _nativeLastMs) : 16.7;
      _nativeLastMs = now;
      if (!isFinite(dt) || dt < 1 || dt > 100) dt = 16.7;
      try {
        model.internalModel.update(dt, now);
      } catch (e) { }
    }

    function _paramTick() {
      // —— ticker 里的参数引擎 ——
      _ensureOutfitHook();   // 每帧确认换装锁挂在当前模型的 afterMotionUpdate 上
      _nativeMotionTick();
      // 部件隐藏必须每帧强制写回（模型/物理可能改 part opacity）
      _applyHiddenParts();
      // 换装参数同理：模型 update 会把服装参数改回动作里写死的值，
      // 这里每帧压回用户选的那套，否则"换完装一播动作就穿回去了"。
      _applyOutfitLock();
      // 选中部件的轮廓高亮跟随模型变换/动画
      _updateHighlight();
      // 动作（模型自带 motion）在 render 阶段的 internalModel.update 内应用，
      // 晚于 ticker 回调 → 期间必须让出参数写入权，否则动作与参数互相拉扯抖动。
      _motionLoopTick();
      if (_isMotionPlaying() && !_isIdleMotionPlaying()) {
        // 即使显式动作在播，也要让 TTS 口型锁生效（动作可能自带嘴型）
        _applyMouthLock();
        _applyOutfitLock();
        return;
      }
      var now = performance.now();
      _tweenTick(now);   // 低优先级：setParams 平滑
      _trackTick(now);   // 中优先级：鼠标跟随（覆盖 tween）
      _streamTick(now);  // 高优先级：流式 / 内置动画（覆盖以上）
      _swayTick(now);    // 拖拽惯性：身体/头发/衣物摆动（叠加在上述参数之上）
      // 最后再压一次口型锁 —— motion/physics/expression 都更完了，确保是最后写入
      _applyMouthLock();
      _applyOutfitLock();
    }

    // ============ CDN 等待 + 初始化 ============
    function waitForCDN() {
      if (window.PIXI && window.PIXI.live2d) {
        startLoad();
      } else {
        setTimeout(waitForCDN, 200);
      }
    }

    // ==== 加载失败自动重试 ====
    // 现场故障：偶发 PIXI.live2d.Live2DModel.from 直接 reject（"Aborted"：请求被
    // 中断 / GL 资源分配失败），页面就一直停在空白 —— model 为空、kids:0、
    // frames:0，ready 永远 false，外部 show 只能干等 75s 报「模型加载超时」。
    // 整页重建渲染器（新 canvas + 新 WebGL 上下文）后同一份模型通常就能加载，
    // 所以这里自动重建重试，用户无感；只有全部重试都失败才向 Python 报错。
    var _loadRetry = 0, _LOAD_RETRY_MAX = 2;
    function _retryLoad(url) {
      if (_loadRetry >= _LOAD_RETRY_MAX) return false;
      _loadRetry++;
      console.warn('[load] 自动重试 ' + _loadRetry + '/' + _LOAD_RETRY_MAX + '（' + url + '）');
      setTimeout(function () {
        try { window.__rebuildRenderer(url); } catch (e) { console.error('[load] retry failed:', e); }
      }, 800);
      return true;
    }
    function _failLoad(msg, url, bootSeq) {
      if (bootSeq !== _switchSeq) return;       // 过期加载：结果交给当前这次
      _modelReady = false;
      _lastSwitchError = msg;
      console.error('Live2D load failed:', msg);
      if (_retryLoad(url)) return;              // 还有重试机会，先不向 Python 报错
      if (window.bridge && window.bridge.notifyModelError) {
        try { window.bridge.notifyModelError(msg); } catch (e) { }
      }
    }

    function startLoad(optModelUrl) {
      try {
        var qs = new URLSearchParams(location.search);
        // 首次加载用 query 里的 model；切换模型时由 __rebuildRenderer 显式传入新 URL
        var modelUrl = optModelUrl || qs.get('model');
        _modelJsonUrl = modelUrl || '';
        _directMode = qs.get('direct') === '1';
        // 首帧就用 Python 传来的 Stage/Clip，避免模型先按整屏适配再跳回来。
        var _qStage = _parseRect(qs.get('stage'), null);
        var _qClip = _parseRect(qs.get('clip'), null);
        if (_qStage) _layoutStage = _qStage;
        _layoutMode = (qs.get('clipMode') === 'full') ? 'full' : 'local';
        _layoutClip = _qClip || ((_layoutMode === 'full')
          ? { x: 0, y: 0, w: window.innerWidth, h: window.innerHeight }
          : _layoutStage);
        // Python 侧传入原始帧端点端口（未传则自动回退 PNG dataURL 通道）
        setFrameEndpoint(qs.get('framePort'), qs.get('ftoken'));

        // —— devicePixelRatio 适配 ——
        // PIXI 的 autoDensity + resolution 组合:让 canvas 内部缓冲使用物理像素,
        // CSS 尺寸保持逻辑像素,高 DPI 屏幕上渲染锐利不模糊。
        // antialias:true 开启 WebGL 抗锯齿 —— 消除模型边缘锯齿线。
        // preserveDrawingBuffer 只在旧回传链路需要；直出模式直接合成上屏，关掉它。
        var dpr = Math.max(1, Math.min(3, window.devicePixelRatio || 1));

        app = new PIXI.Application({
          backgroundAlpha: 0,
          autoStart: true,
          preserveDrawingBuffer: !_directMode,
          antialias: true,                    // 关键:开启抗锯齿,消除 Live2D 模型边缘锯齿
          resolution: dpr,                     // 关键:渲染缓冲使用物理像素分辨率
          autoDensity: true,                   // 自动按 resolution 缩放 CSS 尺寸
          width: window.innerWidth,
          height: window.innerHeight
        });
        document.body.appendChild(app.view);
        _applyCanvasClip();
        // 原生 autoUpdate 挂在 PIXI.Ticker.shared 上；PIXI.Application 默认用的是
        // 自己的 app.ticker，shared 可能从未启动。显式启动它，呼吸/眨眼/原生 idle
        // 以及 motionManager 的原生更新才会按帧运行。
        try { if (PIXI.Ticker && PIXI.Ticker.shared) PIXI.Ticker.shared.start(); } catch (e) { }
        // 上下文丢失 / 恢复监听：丢失后必须丢弃所有 GPU 资源引用 → 整页重建
        app.view.addEventListener('webglcontextlost', function (ev) {
          try { ev.preventDefault(); } catch (e) { }
          _onContextLost('event');
        }, false);
        app.view.addEventListener('webglcontextrestored', function () {
          console.warn('[gl] context restored（仍需重建模型，由 reload 兜底）');
          if (!_glLost) _glLost = true;
        }, false);
        // 直出模式用 CSS 逻辑尺寸定模型高度：PIXI 的 view.width 是物理像素，
        // 直接用它会让同一窗口在 125%/150% DPI 下显示成不同大小。
        targetW = _directMode ? window.innerWidth : app.view.width;
        targetH = _directMode ? window.innerHeight : app.view.height;

        // 配音：开启声音、关掉 motionSync（否则音频加载失败会让动作永远不开始）
        _applySoundConfig();

        // resize 监听全局只绑一次：切换模型会换掉 app，回调里必须读「当前」app
        if (!window.__resizeBound) {
          window.__resizeBound = true;
          window.addEventListener('resize', function () {
            if (!app || !app.renderer) return;
            // 直出模式由 syncViewportNow 统一处理；这里也调一次，
            // 保证 resize 事件到达的同一轮就完成画布/模型对齐。
            syncViewportNow();
            if (!_directMode) {
              app.renderer.resize(window.innerWidth, window.innerHeight);
              targetW = app.view.width;
              targetH = app.view.height;
              applyFit();
            }
          });
        }

        // 参数引擎：默认优先级，早于 app.render（PIXI 用 LOW 优先级渲染）
        // 每帧先同步视口，再跑参数/动作，保证本帧就是新窗口尺寸下的正确位置。
        app.ticker.add(function () { syncViewportNow(); _paramTick(); });
        // 帧推送：比渲染更低优先级 → 同一帧内读到的就是刚渲染好的画面（少一帧延迟）
        if (!_directMode) app.ticker.add(function () { _pushTick(); }, null, -50);

        // 初始加载也有自己的序号：若加载期间用户已切换模型，初始模型必须丢弃，
        // 否则它会在切换完成后才 addChild，与新模型同屏 → 部件乱排。
        var bootSeq = _switchSeq;
        // 加载看门狗：20s 还没就绪就当失败处理（走重试）——不能让页面无限停在
        // 空白态，否则外部 show 会一直等到 75s 超时，用户看到的是「命令一直运行中」。
        var _loadGuard = setTimeout(function () {
          if (bootSeq !== _switchSeq || _modelReady) return;
          _failLoad('模型加载超时', modelUrl, bootSeq);
        }, 20000);
        // 仅诊断：打印当前 WebGL 能力和 pixi-live2d 默认配置（不修改）
        _diagnoseConfig(modelUrl, app);
        PIXI.live2d.Live2DModel.from(modelUrl, { autoInteract: false })
          .then(function (m) {
            clearTimeout(_loadGuard);
            if (bootSeq !== _switchSeq) {
              var staleUrls = _modelTextureUrls(m);
              try { m.destroy({ children: true }); } catch (e) { }
              _releaseTextures(staleUrls);
              return;
            }
            if (!app || !app.stage) {
              var staleUrls2 = _modelTextureUrls(m);
              try { m.destroy({ children: true }); } catch (e) { }
              _releaseTextures(staleUrls2);
              return;
            }
            model = m;
            _loadRetry = 0;          // 加载成功 → 重试计数归零
            resetParamInfo();
            model.anchor.set(0.5, 0.5);
            // 记录原始尺寸（优先取 internalModel 布局尺寸，加载完成即可靠）
            var base = measureModelBase(model);
            modelBaseW = base[0];
            modelBaseH = base[1];
            applyFit();
            _cropReset();
            // 保留模型自带背景：不再自动隐藏底层大面积部件。
            _partNames();          // 顺手把部件名（cdi3）先拉一次，双击判定用
            _partNamesAsync();
            app.stage.addChild(model);
            try { _swayInit(); } catch (e) { }

            // 停止内置待机动作，避免覆盖捏脸参数；并禁止动作结束后自动重播 Idle
            try { model.internalModel.motionManager.stopAllMotions(); } catch (e) { }
            _installDrawHook(model);
            _setupMotion(model);
            _installMouthLock(model);
            // 新模型 = 服装参数全新：旧模型的换装锁定表不能带过来（参数 id 可能撞名）
            _clearOutfitLock();

            _modelReady = true;
            _lastSwitchError = '';
            // 加载成功 → 若距上次上下文重建已超过 2 分钟，把重建计数清零（正常使用不再累计）
            try {
              var _ts = parseFloat(sessionStorage.getItem('glRebuildAt') || '0');
              if (Date.now() - _ts > 120000) sessionStorage.setItem('glRebuild', '0');
            } catch (e) { }
            // 通知 Python 端：模型加载完成，隐藏加载泡泡
            if (window.bridge) window.bridge.notifyModelReady();
          })
          .catch(function (err) {
            clearTimeout(_loadGuard);
            _failLoad(String(err && err.message ? err.message : err), modelUrl, bootSeq);
          });
      } catch (e) {
        console.error('PIXI init failed:', e);
      }
    }

    // ==== 切换模型：页面内重建渲染器（不重载文档、不动 Qt 侧对象）====
    // 两条已验证的死路：
    // ① 同一 QWebEngineView 里 page.load() 重载：第 2 次起 Chromium 合成器复用已回收的
    //    shared image（"non-existent mailbox"），画面碎块；
    // ② 销毁 QWebEngineView / QWebEnginePage 换新页：Qt 在 Qt5Core 里 fail-fast
    //    直接杀进程（0xc0000409）。
    // 正确做法：只销毁 WebGL 层的「模型 + pixi Application + canvas」，再用新 canvas
    // 建全新 WebGL 上下文。Qt 侧一个对象都不动，每次切换 GL 状态都是干净的。
    // 实验已验证：同一页面连续 6 次重建（含 kalangshitade_2 两次、heitaizi_2）全部正确。
    function _teardownRenderer() {
      var oldCv = app ? app.view : null;
      var oldUrls = _modelTextureUrls(model);
      try { if (model) model.destroy({ children: true }); } catch (e) { }
      model = null;
      // 整页重建会丢 WebGL 上下文：上下文一丢，缓存里的 BaseTexture 全部变成
      // 指向已释放显存的僵尸对象。若不清缓存，下次加载同一个模型（同一 URL）
      // 会命中这些僵尸贴图 → 又是碎贴图。趁 GL 还活着先把它们全部销毁。
      _releaseTextures(oldUrls);
      try {
        var cache = PIXI.utils.TextureCache;
        for (var k in cache) {
          if (!Object.prototype.hasOwnProperty.call(cache, k)) continue;
          try { cache[k].destroy(true); } catch (e) { }
          try { delete cache[k]; } catch (e) { }
        }
      } catch (e) { }
      try {
        if (app) {
          var gl = app.renderer && app.renderer.gl;
          var ext = gl && gl.getExtension('WEBGL_lose_context');
          if (ext) ext.loseContext();           // 立刻归还纹理/帧缓冲
          app.destroy(true, { children: true });
        }
      } catch (e) { }
      app = null;
      try {
        var cvs = document.querySelectorAll('canvas');
        for (var i = 0; i < cvs.length; i++) {
          if (cvs[i].parentNode) cvs[i].parentNode.removeChild(cvs[i]);
        }
        if (oldCv && oldCv.parentNode) oldCv.parentNode.removeChild(oldCv);
      } catch (e) { }
    }

    window.__rebuildRenderer = function (modelUrl) {
      try {
        _intentionalLost = true;            // 接下来主动丢的上下文不要触发整页 reload
        _switchSeq++;                       // 作废一切在途加载
        _modelReady = false;
        _lastSwitchError = '';
        _suspendedFrames = false;
        _switchBusy = false;
        _glLost = false;
        _teardownRenderer();
        startLoad(modelUrl);                // 新 canvas + 新 WebGL 上下文 + 加载新模型
        setTimeout(function () { _intentionalLost = false; }, 1200);
        return true;
      } catch (e) {
        _intentionalLost = false;
        console.error('[rebuild] failed:', e);
        _modelReady = false;
        _lastSwitchError = String(e && e.message ? e.message : e);
        return false;
      }
    };

    waitForCDN();
  </script>
</body>

</html>
